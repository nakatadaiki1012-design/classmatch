<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- 書体: クラス名などは読みやすいUDゴシック、数字は桁がそろう等幅（オフライン時は端末の書体で表示） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <title>クラ���マッチ ライブ</title>
  <style>
/* ── CSS Variables ────��────────────────────── */
:root {
  --primary:#2563eb; --navy:#1e3a5f; --ok:#16a34a;
  --surface:#fff; --surface2:#f8fafc; --border:#e2e8f0; --border2:#cbd5e1;
  --muted:#64748b; --subtle:#94a3b8; --text:#1e293b;
  font-family:'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;}

/* ── Header ────────────────────────────────── */
header{
  position:sticky;top:0;z-index:50;
  background:var(--navy);color:#fff;
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
header h1{font-size:16px;font-weight:800;}
header h1 span{font-weight:400;opacity:.7;}
#headerSub{font-size:11px;opacity:.65;margin-top:1px;}
#liveIndicator{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;
  background:rgba(255,255,255,.15);
  padding:4px 10px;border-radius:999px;white-space:nowrap;
}
#liveDot{
  width:8px;height:8px;border-radius:50%;background:#4ade80;
  animation:liveDot .9s ease-in-out infinite;flex-shrink:0;
}
@keyframes liveDot{0%,100%{opacity:1;}50%{opacity:.2;}}
#lastUpdated{font-size:10px;opacity:.7;white-space:nowrap;}

/* ── Layout ────────────────────────────────── */
main{max-width:1200px;margin:0 auto;padding:14px 12px 40px;}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px;margin-bottom:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.hidden{display:none!important;}

/* ── Event Tabs ─────────────────────────────── */
#eventTabs{
  display:flex;gap:6px;flex-wrap:wrap;
  margin-bottom:14px;padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.tabBtn{
  padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;
  border:1.5px solid var(--border2);background:var(--surface2);
  color:var(--text);cursor:pointer;transition:all .15s;
}
.tabBtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tabBtn .prog{
  display:inline-block;margin-left:5px;font-size:10px;opacity:.7;
}

/* ── Progress bar ───────────────────────────── */
.progWrap{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;margin-bottom:12px;
  background:var(--surface2);border-radius:8px;border:1px solid var(--border);
  font-size:13px;
}
progress{flex:1;height:8px;border-radius:4px;}
progress::-webkit-progress-bar{background:#e2e8f0;border-radius:4px;}
progress::-webkit-progress-value{background:var(--ok);border-radius:4px;transition:width .4s;}

/* ── SVG bracket styles ─────────────────────── */
.line{fill:none;stroke:#cbd5e1;stroke-width:1.5;stroke-linecap:square;}
.line.win{stroke:#16a34a;stroke-width:2.5;}
.sideBox{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1;}
.sideBox.match-playing{fill:#fff1f2;stroke:#f43f5e;stroke-width:2;animation:playPulse 1.5s ease-in-out infinite;}
.sideBox.match-calling{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5;animation:callPulse 1.2s ease-in-out infinite;}
.sideBox.overtime-pulse{fill:#fef3c7!important;stroke:#f97316!important;stroke-width:2.5;animation:otPulse .8s ease-in-out infinite!important;}
.sideBox.selected{stroke:var(--primary)!important;stroke-width:2.5;}
.teamTxtH{fill:var(--text);}
.teamTxtH.subtle{fill:var(--subtle);}
.vsTxt{fill:#94a3b8;}
.roundLabel{fill:var(--muted);font-weight:700;}
.hlBox{stroke:var(--primary);stroke-width:2;fill:none;stroke-dasharray:4 2;}
.hlBox.hidden{display:none;}
@keyframes playPulse{0%,100%{stroke-width:2;}50%{stroke-width:3;}}
@keyframes callPulse{0%,100%{opacity:1;}50%{opacity:.6;}}
@keyframes otPulse{0%,100%{fill:#fef3c7;}50%{fill:#fed7aa;}}

/* ── Empty / error states ───────────────────── */
#loadingMsg,#errorMsg{
  text-align:center;padding:40px 20px;font-size:15px;color:var(--muted);
}
#errorMsg{color:#dc2626;}

/* ── Live badge in bracket area ─────────────── */
.sectionHead{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;flex-wrap:wrap;gap:6px;
}
.sectionHead h2{font-size:17px;font-weight:800;color:var(--navy);margin:0;}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;
  white-space:nowrap;
}
.badge.green{background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0;}
.badge.red  {background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;}
.badge.blue {background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe;}
.badge.orange{background:#fff7ed;color:#ea580c;border:1px solid #fed7aa;}
.badge.gray {background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;}

.bracketWrap{overflow-x:auto;padding:0;}
.championBanner{
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;margin-bottom:14px;
  background:linear-gradient(90deg,#fef9c3,#fde68a);
  border:2px solid #fbbf24;border-radius:12px;
  box-shadow:0 2px 10px rgba(251,191,36,.3);
  animation:champIn .4s ease;
}
.championBanner .cbTrophy{font-size:38px;line-height:1;animation:champBounce 1.6s ease-in-out infinite;}
.championBanner .cbLabel{font-size:12px;font-weight:700;color:#a16207;letter-spacing:2px;}
.championBanner .cbName{font-size:24px;font-weight:900;color:#78350f;line-height:1.1;}
@keyframes champIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
@keyframes champBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.loserLabel{
  margin:20px 0 8px;padding:8px 12px;
  background:linear-gradient(90deg,#f5f3ff,#ede9fe);
  border-left:4px solid #7c3aed;border-radius:0 8px 8px 0;
  font-size:11px;color:#7c3aed;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
}

/* ── Match status legend ────────────────────── */
#legend{
  display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;
  font-size:11px;color:var(--muted);align-items:center;
}
.legendItem{display:flex;align-items:center;gap:4px;}
.legendBox{
  width:14px;height:14px;border-radius:3px;
  border:1.5px solid #cbd5e1;
}
.legendBox.playing{background:#fff1f2;border-color:#f43f5e;}
.legendBox.calling{background:#fffbeb;border-color:#f59e0b;}
.legendBox.done   {background:#dcfce7;border-color:#16a34a;}
.legendBox.pending{background:#f8fafc;border-color:#cbd5e1;}

/* ── League table ─────────────────────────── */
.leagueWrap{overflow-x:auto;}
.league-table{border-collapse:collapse;font-size:13px;min-width:100%;}
.league-table th,.league-table td{border:1px solid var(--border2);padding:6px 10px;text-align:center;}
.league-table th{background:#f1f5f9;font-weight:700;color:var(--navy);}
.league-cell.win{background:#dcfce7;font-weight:700;}
.league-cell.loss{background:#fee2e2;color:#991b1b;}
.league-cell.draw{background:#fef9c3;}

/* ── 見やすさ調整（生徒のスマホ・タブレット向け）── */
body{font-size:15px;}
header{padding:8px 14px;}
header h1{font-size:17px;}
#headerSub{font-size:12px;}
#liveIndicator{font-size:12px;}
#lastUpdated{font-size:11px;}
main{padding:6px 6px 32px;}
.card{padding:10px 8px;margin-bottom:8px;border-radius:10px;}
/* 競技タブ: 1行で横スクロール */
#eventTabs.tabStrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 2px;
  border-bottom:none;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#eventTabs.tabStrip::-webkit-scrollbar{display:none;}
.tabBtn{flex:0 0 auto;font-size:15px;padding:8px 14px;min-height:42px;white-space:nowrap;}
.tabBtn .prog{font-size:12px;}
.tabBtn .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-left:6px;vertical-align:middle;animation:liveDot .9s ease-in-out infinite;}
.sectionHead{margin-bottom:6px;padding:0 4px;}
.sectionHead h2{font-size:21px;}
.badge{font-size:13px;padding:4px 11px;}
.ctlRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;padding:0 4px;}
.seg{display:inline-flex;align-items:center;gap:2px;background:#e2e8f0;border-radius:10px;padding:3px;}
.seg button{border:none;background:transparent;color:#475569;font-weight:700;font-size:14px;
  min-width:48px;min-height:42px;padding:0 12px;border-radius:8px;cursor:pointer;font-family:inherit;}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.15);}
#myTeam{flex:1;min-width:96px;max-width:220px;height:48px;border:1px solid var(--border2);border-radius:10px;
  padding:0 10px;font-size:14px;font-weight:700;color:var(--navy);background:#fff;font-family:inherit;}
#myTeam.on{background:#fef9c3;border-color:#eab308;}
.iconBtn{width:48px;height:48px;border:1px solid var(--border2);border-radius:10px;background:#fff;font-size:18px;cursor:pointer;}
.iconBtn[aria-expanded="true"]{background:#e2e8f0;}
#settingsPanel{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;}
#settingsPanel.hidden{display:none;}
.setRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.setLbl{font-size:13px;font-weight:700;color:var(--muted);min-width:64px;}

/* ── 試合一覧（スマホで読みやすい縦並び） ── */
.ml{display:flex;flex-direction:column;gap:10px;}
.mlSec{font-size:15px;font-weight:800;color:var(--navy);margin:14px 0 2px;display:flex;align-items:center;gap:8px;}
.mlSec:first-child{margin-top:0;}
.mlSec small{font-size:12px;color:var(--muted);font-weight:600;}
.mlSec.final{color:#b45309;}
.mc{background:#fff;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;}
.mc.st-playing{border-color:#ef4444;box-shadow:0 0 0 2px rgba(239,68,68,.15);}
.mc.st-calling{border-color:#f59e0b;}
.mcHead{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#f8fafc;border-bottom:1px solid var(--border);
  font-size:13px;font-weight:700;color:#475569;}
.mcHead .t{font-family:ui-monospace,monospace;color:var(--navy);}
.mcHead .stTag{margin-left:auto;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:800;}
.stTag.playing{background:#ef4444;color:#fff;} .stTag.calling{background:#f59e0b;color:#fff;}
.stTag.final{background:#dcfce7;color:#15803d;} .stTag.waiting{background:#e2e8f0;color:#64748b;}
.mcRow{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:18px;font-weight:700;color:var(--text);}
.mcRow + .mcRow{border-top:1px solid #eef2f7;}
.mcRow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mcRow .sc{font-family:ui-monospace,monospace;font-size:20px;font-weight:800;min-width:28px;text-align:right;}
.mcRow.win{background:#dcfce7;color:#14532d;}
.mcRow.win .nm::after{content:" 勝";font-size:12px;font-weight:800;color:#15803d;margin-left:4px;}
.mcRow.lose{color:#9ca3af;font-weight:600;}
.mcRow.tbd .nm{color:#94a3b8;font-weight:500;font-size:15px;}
.mcRow.mine{box-shadow:inset 5px 0 0 #ca8a04;background:#fef9c3;}
.mcRow.mine.win{background:#fef08a;}
body.fz-s .mcRow{font-size:16px;padding:8px 12px;} body.fz-s .mcRow .sc{font-size:17px;}
body.fz-l .mcRow{font-size:21px;padding:12px 14px;} body.fz-l .mcRow .sc{font-size:23px;} body.fz-l .mcHead{font-size:15px;}
body.fz-l .tabBtn{font-size:17px;} body.fz-l .sectionHead h2{font-size:24px;}
body.fz-s .tabBtn{font-size:14px;padding:6px 12px;min-height:42px;}
.emptyNote{padding:16px;text-align:center;color:var(--muted);}
.mcHead .rn{color:var(--navy);font-weight:800;}
.mlRound{font-size:15px;font-weight:800;color:#475569;margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--border2);}
.mlRound small{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px;}
.mlRound.final{color:#b45309;}
/* 終了した試合: 1行 */
.rl{display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:8px;padding:9px 12px;background:#fff;
  border:1px solid var(--border);border-radius:10px;font-size:16px;}
.rl .rlNum{font-size:11px;color:var(--muted);font-weight:700;min-width:28px;}
.rl .rlW{font-weight:800;color:#14532d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rl .rlW::after{content:" 勝";font-size:11px;color:#15803d;}
.rl .rlL{color:#9ca3af;font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rl .rlS{font-family:ui-monospace,monospace;font-weight:800;color:#334155;white-space:nowrap;}
.rl .rlS i{font-style:normal;color:#cbd5e1;margin:0 3px;}
.rl.mine{background:#fef9c3;border-color:#eab308;}
body.fz-l .rl{font-size:19px;} body.fz-s .rl{font-size:14px;}
/* 最終順位 */
.podium{display:grid;gap:6px;margin-bottom:12px;}
.podium>div{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-size:15px;}
.podium span{font-weight:800;min-width:76px;}
.podium b{font-size:20px;}
.pd1{background:linear-gradient(90deg,#fef9c3,#fde68a);border:2px solid #f59e0b;color:#78350f;}
.pd1 b{font-size:24px;}
.pd2{background:#f1f5f9;border:1px solid #cbd5e1;color:#334155;}
.pd3{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;}
/* 自分のクラスの状況 */
.teamBox{border-radius:12px;padding:10px 14px;margin-bottom:12px;border:2px solid #eab308;background:#fef9c3;}
.teamBox .tbHead{font-size:13px;font-weight:800;color:#a16207;}
.teamBox .tbText{font-size:17px;font-weight:800;color:#422006;margin-top:2px;line-height:1.4;}
.teamBox.k-live{border-color:#ef4444;background:#fee2e2;} .teamBox.k-live .tbText{color:#991b1b;}
.teamBox.k-win{border-color:#f59e0b;background:#fde68a;}
.teamBox.k-out,.teamBox.k-none{border-color:#cbd5e1;background:#f8fafc;} .teamBox.k-out .tbText,.teamBox.k-none .tbText{color:#475569;}
body.fz-l .teamBox .tbText{font-size:20px;}
/* いま試合中（表の上） */
.nowStrip{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.ns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border:1.5px solid #fca5a5;background:#fff1f2;border-radius:10px;font-size:14px;}
.ns b{font-size:16px;} .ns i{font-style:normal;color:#94a3b8;font-weight:500;margin:0 2px;}
.ns .stTag{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:800;}
.autoNote{font-size:13px;color:var(--muted);margin:-2px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.autoNote button{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;font-weight:700;border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;}
@media(max-width:600px){
  header h1{font-size:14px;}
  .card{padding:12px;}
}
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="viewerTitle">🏆 クラスマッチ <span>ライブ</span></h1>
      <div id="headerSub">-</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
      <div id="liveIndicator">
        <span id="liveDot"></span>
        <span id="liveStatus">接続中...</span>
      </div>
      <div id="lastUpdated"></div>
    </div>
  </header>

  <main>
    <div id="loadingMsg">📡 データを読み込んでいます...</div>
    <div id="errorMsg" class="hidden">❌ ブラケットデータが見つかりません。<br/>先生から共有リンクを受け取ってください。</div>

    <div id="viewerContent" class="hidden">
      <!-- 競技タブ（1行・横スクロール） -->
      <div id="eventTabs" class="tabStrip"></div>

      <div class="card" id="bracketCard">
        <div class="sectionHead">
          <h2 id="eventTitle">-</h2>
          <div id="eventStatusBadge"></div>
        </div>
        <div class="ctlRow">
          <div class="seg" id="segView" role="group" aria-label="表示">
            <button data-v="auto">自動</button><button data-v="tree">表</button><button data-v="list">一覧</button>
          </div>
          <select id="myTeam" aria-label="自分のクラス"><option value="">👤 クラス</option></select>
          <button id="btnSettings" class="iconBtn" aria-label="表示の設定" aria-expanded="false">⚙</button>
        </div>
        <div id="settingsPanel" class="hidden">
          <div class="setRow"><span class="setLbl">表の向き</span>
            <div class="seg" id="segOrient" role="group" aria-label="表の向き">
              <button data-v="h">横型</button><button data-v="v">縦型</button>
            </div></div>
          <div class="setRow"><span class="setLbl">文字</span>
            <div class="seg" id="segFont" role="group" aria-label="文字の大きさ">
              <button data-v="s">小</button><button data-v="m">中</button><button data-v="l">大</button>
            </div></div>
        </div>
        <div class="bracketWrap" id="bracket"></div>
      </div>
    </div>
  </main>

<script src="firebase-sync.js"></script>
<script src="bracket-render.js"></script>
<script>
(function() {
  // ── Utilities ──────────────────────────────
  const el = id => document.getElementById(id);
  function escapeHtml(s) {
    return String(s)
      .replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&quot;");
  }
  function fmtTime(d) {
    if (!d) return "";
    const dt = new Date(d);
    return String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0");
  }
  function formatTeamName(name) {
    if (!name) return name;
    if (name.startsWith("__L|") && name.endsWith("__")) {
      const content = name.replaceAll("__L|","").replaceAll("__","");
      const parts = content.split("|");
      return parts.length >= 2 ? `${parts[1]}\nの負け` : `${parts[0]}\nの負け`;
    }
    return name;
  }

  // ── Decode share ───────────────────────────
  function decodeShare(code) {
    // 管理画面は URL セーフな base64（- と _ 、= なし）で作るので、元に戻してから読む
    const b64 = code.replace(/-/g, "+").replace(/_/g, "/");
    const pad = "=".repeat((4 - b64.length % 4) % 4);
    return JSON.parse(decodeURIComponent(escape(atob(b64 + pad))));
  }

  // ── State ──────────────────────────────────
  let state = null;
  let currentEventId = null;
  const STORAGE_KEY = "classmatch_local_v2_state";

  // ── BroadcastChannel listener ──────────────
  if (typeof BroadcastChannel !== "undefined") {
    const ch = new BroadcastChannel("classmatch-live");
    ch.addEventListener("message", e => {
      if (mode === "fb") return;                       // Firebaseで受信中は、そちらを正とする
      if (e.data?.type === "state-update" && e.data.state) {
        state = e.data.state;
        renderAll();
        el("liveStatus").textContent = "同期中 (ライブ)";
        el("lastUpdated").textContent = "たった今更新";
      }
    });
  }

  // ── Load state ─────────────────────────────
  function loadState() {
    // 0) Firebase（?t=共有コード）… リアルタイム受信
    const code = new URLSearchParams(location.search).get("t");
    if (code && window.FirebaseSync) {
      const m = /(?:^|[#&])fb=([^&]+)/.exec(location.hash);
      const cfg = (m && FirebaseSync.decodeConfig(m[1])) || FirebaseSync.getConfig();
      if (cfg) { startFirebase(code, cfg); return; }
    }
    // 1) URL hash #share=...
    const hash = location.hash.replace(/^#/, "");
    if (hash.startsWith("share=")) {
      try {
        state = decodeShare(hash.slice(6));
        el("liveStatus").textContent = "スナップショット";
        el("lastUpdated").textContent = "URLから読み込み";
        renderAll();
        return;
      } catch(e) {
        showError();
        return;
      }
    }
    // 2) localStorage (same device)
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state = JSON.parse(raw);
        el("liveStatus").textContent = "同期中 (ライブ)";
        el("lastUpdated").textContent = "ローカルデータ";
        renderAll();
        return;
      }
    } catch {}
    showError();
  }

  // ── Firebase リアルタイム受信 ──────────────────
  var mode = "local";                                  // "fb" | "local" | "snapshot"
  const fbInfo = { connected: null, pubAt: null, offset: 0, hasData: false, failed: false, code: "" };
  const toArr = (v) => Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []);
  // Firebase は空の配列を保存しない／まばらな配列をオブジェクトで返すので、配列に整える
  function fromFirebase(data) {
    const events = toArr(data.events).map(ev => Object.assign({}, ev, { matches: toArr(ev.matches), loserMatches: ev.loserMatches ? toArr(ev.loserMatches) : undefined }));
    const t = Object.assign({}, data.tournament || {}); t.classes = toArr(t.classes);
    return { tournament: t, events };
  }
  const ago = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s < 10 ? "たった今" : s < 60 ? s + "秒前" : s < 3600 ? Math.floor(s / 60) + "分前" : Math.floor(s / 3600) + "時間前"; };
  const clock = (ms) => new Date(ms).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  function paintLive() {
    if (mode !== "fb") return;
    const dot = el("liveDot"), st = el("liveStatus"), lu = el("lastUpdated");
    const age = fbInfo.pubAt ? (Date.now() + fbInfo.offset) - fbInfo.pubAt : null;
    let color = "#4ade80", anim = "", label = "ライブ";
    if (fbInfo.failed && !fbInfo.hasData) { color = "#f87171"; anim = "none"; label = "接続できません"; }
    else if (fbInfo.failed || fbInfo.connected === false) { color = "#f87171"; anim = "none"; label = "オフライン"; }
    else if (fbInfo.connected === null) { color = "#fbbf24"; label = "接続中…"; }
    dot.style.background = color; dot.style.animation = anim; st.textContent = label;
    lu.textContent = fbInfo.pubAt ? `最終更新 ${clock(fbInfo.pubAt)}（${ago(age)}）` + ((fbInfo.failed || fbInfo.connected === false) ? " ※通信が戻ると自動で更新" : "") : "";
    lu.style.color = age != null && age > 15 * 60 * 1000 && fbInfo.connected !== false ? "#fde68a" : "";
  }
  async function startFirebase(code, cfg) {
    mode = "fb"; fbInfo.code = code;
    const CK = "cm_viewer_cache_" + code;
    // 直前のデータがあれば先に表示（回線が遅くても空白にしない）
    try { const c = JSON.parse(localStorage.getItem(CK) || "null"); if (c && c.state) { state = c.state; fbInfo.pubAt = c.pubAt; fbInfo.hasData = true; renderAll(); } } catch {}
    paintLive();
    try { await FirebaseSync.init(cfg); }
    catch (e) { fbInfo.failed = true; paintLive(); if (!fbInfo.hasData) showError(); return; }
    FirebaseSync.onServerOffset(o => { fbInfo.offset = o; paintLive(); });
    FirebaseSync.onConnection(c => { fbInfo.connected = c; paintLive(); });
    FirebaseSync.subscribe(code, data => {
      if (!data || !data.tournament) {
        if (!fbInfo.hasData) { el("loadingMsg").classList.add("hidden"); el("errorMsg").innerHTML = "❌ この大会はまだ共有されていません。<br/>先生にリンクを確認してください。"; el("errorMsg").classList.remove("hidden"); }
        return;
      }
      fbInfo.failed = false; fbInfo.hasData = true; fbInfo.pubAt = data.pubAt || fbInfo.pubAt;
      state = fromFirebase(data);
      try { localStorage.setItem(CK, JSON.stringify({ state, pubAt: fbInfo.pubAt })); } catch {}
      renderAll(); paintLive();
    }, err => { fbInfo.failed = true; paintLive(); if (!fbInfo.hasData) showError(); });
    setInterval(paintLive, 10000);                    // 「3分前」の表示を進める
  }

  function showError() {
    el("loadingMsg").classList.add("hidden");
    el("errorMsg").classList.remove("hidden");
    el("liveStatus").textContent = "未接続";
    el("liveDot").style.background = "#f87171";
    el("liveDot").style.animation = "none";
  }

  // ── Render ─────────────────────────────────
  function renderAll() {
    if (!state) { showError(); return; }
    el("loadingMsg").classList.add("hidden");
    el("errorMsg").classList.add("hidden");
    el("viewerContent").classList.remove("hidden");

    const t = state.tournament || {};
    el("viewerTitle").innerHTML = `🏆 ${escapeHtml(t.name || "クラスマッチ")} <span>ライブ</span>`;
    el("headerSub").textContent = [t.date, t.place].filter(Boolean).join(" / ");

    if (t.updatedAt && mode !== "fb") {
      const d = new Date(t.updatedAt);
      el("lastUpdated").textContent = d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"}) + " 更新";
    }

    // 全体の進み具合は見出しの下に1行で
    const events = state.events || [];
    let total = 0, done = 0;
    for (const ev of events) {
      const ms = [...(ev.matches||[]), ...(ev.loserMatches||[])].filter(m=>!m.isBye&&!m.isExhibition);
      total += ms.length;
      done  += ms.filter(m=>m.state==="final"&&(m.winner||m.draw)).length;
    }
    el("headerSub").textContent = [t.date, t.place, total ? `全体 ${done}/${total} 試合終了` : ""].filter(Boolean).join(" ・ ");

    fillTeamSelect();
    renderTabs();
    renderCurrentEvent();
  }

  const evLabel = (ev) => ev.sportName
    ? `${ev.sportName} ${ev.gender === "M" ? "男子" : ev.gender === "F" ? "女子" : ev.gender === "X" ? "混合" : ""}`.trim()
    : (ev.name || ev.id);
  const evMatches = (ev) => [...(ev.matches||[]), ...(ev.loserMatches||[])].filter(m=>!m.isBye&&!m.isExhibition);

  // ── 表示設定（この端末に保存） ─────────────────
  const PREF_KEY = "cm_viewer_prefs";
  const FONT = { s: { fontSize: 14 }, m: { fontSize: 15, minFontPx: 13 }, l: { fontSize: 18, minFontPx: 16 } };
  let prefs = { view: "auto", orient: null, font: "m", team: "" };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || "{}")); } catch {}
  function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} }
  // 表の向き: この端末で選んだ向き → 先生が設定した向き → 横型（自動では入れ替えない）
  function currentOrient() {
    const o = (prefs.orient === "h" || prefs.orient === "v") ? prefs.orient : state?.tournament?.bracketOrient;
    return o === "v" ? "v" : "h";
  }
  function syncCtl() {
    const on = (sel, v) => document.querySelectorAll(sel + " button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
    on("#segView", prefs.view); on("#segOrient", currentOrient()); on("#segFont", prefs.font);
    document.body.classList.remove("fz-s", "fz-m", "fz-l");
    document.body.classList.add("fz-" + prefs.font);
    el("myTeam").value = prefs.team || "";
    el("myTeam").classList.toggle("on", !!prefs.team);
  }
  const bindSeg = (sel, key) => document.querySelectorAll(sel + " button").forEach(b => b.onclick = () => {
    prefs[key] = b.dataset.v; savePrefs(); syncCtl(); if (state) renderCurrentEvent();
  });
  bindSeg("#segView", "view"); bindSeg("#segOrient", "orient"); bindSeg("#segFont", "font");
  el("btnSettings").onclick = () => {
    const p = el("settingsPanel"); const open = p.classList.toggle("hidden") === false;
    el("btnSettings").setAttribute("aria-expanded", open ? "true" : "false");
  };
  el("myTeam").onchange = () => { prefs.team = el("myTeam").value; savePrefs(); syncCtl(); if (state) { userPickedEvent = false; pickDefaultEvent(); renderTabs(); renderCurrentEvent(); } };
  function fillTeamSelect() {
    const teams = new Set(state?.tournament?.classes || []);
    (state.events||[]).forEach(ev => evMatches(ev).forEach(m => { [m.teamA, m.teamB].forEach(t => { if (t && !t.startsWith("__L|")) teams.add(t); }); }));
    const sel = el("myTeam"), cur = prefs.team;
    sel.innerHTML = `<option value="">👤 クラス</option>` + [...teams].map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
    sel.value = teams.has(cur) ? cur : "";
  }
  function bracketOpts(bracket) {
    return Object.assign({ maxWidth: bracket.clientWidth, maxHeight: Math.max(360, window.innerHeight - 160),
      orientation: currentOrient(), highlightTeam: prefs.team || null,
      showChampion: !bracket.querySelector(".podium") }, FONT[prefs.font] || FONT.m);
  }

  // 開いたときに見せる競技: 試合中 → 招集中 → 自分のクラスが残っている → 途中まで進行 → 未完了
  let userPickedEvent = false;
  function pickDefaultEvent() {
    const evs = state.events || [];
    if (!evs.length) return;
    if (userPickedEvent && evs.some(e => e.id === currentEventId)) return;
    const score = (ev) => {
      const ms = evMatches(ev);
      const fin = ms.filter(m => m.state === "final").length;
      let sc = 0;
      if (ms.some(m => m.state === "playing")) sc += 1000;
      if (ms.some(m => m.state === "calling")) sc += 500;
      if (prefs.team && ms.some(m => m.state !== "final" && (m.teamA === prefs.team || m.teamB === prefs.team))) sc += 300;
      if (fin > 0 && fin < ms.length) sc += 100;
      if (fin < ms.length) sc += 10;
      return sc;
    };
    let best = evs[0], bs = -1;
    for (const ev of evs) { const s2 = score(ev); if (s2 > bs) { bs = s2; best = ev; } }
    currentEventId = best.id;
  }

  function renderTabs() {
    const tabs = el("eventTabs");
    tabs.innerHTML = "";
    const events = state.events || [];
    if (!events.length) return;
    pickDefaultEvent();
    for (const ev of events) {
      const ms = evMatches(ev);
      const d = ms.filter(m=>m.state==="final"&&(m.winner||m.draw)).length;
      const pct = ms.length ? Math.round(d/ms.length*100) : 0;
      const hasPlaying = ms.some(m=>m.state==="playing");
      const btn = document.createElement("button");
      btn.className = "tabBtn" + (ev.id === currentEventId ? " active" : "");
      btn.innerHTML = escapeHtml(evLabel(ev)) + `<span class="prog">${pct === 100 ? "終了" : d === 0 ? "これから" : pct + "%"}</span>` + (hasPlaying ? `<span class="live" title="試合中"></span>` : "");
      btn.onclick = () => { userPickedEvent = true; currentEventId = ev.id; renderTabs(); renderCurrentEvent(); };
      tabs.appendChild(btn);
    }
    tabs.querySelector(".active")?.scrollIntoView({ block: "nearest", inline: "center" });
  }

  function renderCurrentEvent() {
    const ev = (state.events||[]).find(e=>e.id===currentEventId);
    if (!ev) { el("bracket").innerHTML = "<div class='emptyNote'>競技がありません</div>"; return; }

    syncCtl();
    el("eventTitle").textContent = evLabel(ev);

    const ms = (ev.matches||[]).filter(m=>!m.isBye&&!m.isExhibition);
    const done2 = ms.filter(m=>m.state==="final"&&(m.winner||m.draw)).length;
    const playing = ms.filter(m=>m.state==="playing").length;
    const calling = ms.filter(m=>m.state==="calling").length;
    let badge;
    if (done2 === ms.length && ms.length > 0) badge = `<span class="badge green">✅ 終了</span>`;
    else if (playing > 0) badge = `<span class="badge red">🔴 試合中 ${playing}</span>`;
    else if (calling > 0) badge = `<span class="badge orange">📢 招集中 ${calling}</span>`;
    else badge = `<span class="badge blue">${done2}/${ms.length} 終了</span>`;
    el("eventStatusBadge").innerHTML = badge;

    const bracket = el("bracket");
    bracket.innerHTML = "";

    const info = ev.format === "league" ? null : analyze(ev);
    const champ = getChampion(ev);
    // 1) 最終順位  2) 自分のクラスの状況 を一番上に
    if (info && info.podium) bracket.appendChild(podiumBox(info.podium));
    else if (champ) {
      const banner = document.createElement("div");
      banner.className = "championBanner";
      banner.innerHTML = `<span class="cbTrophy">🏆</span><div><div class="cbLabel">優勝</div><div class="cbName">${escapeHtml(champ)}</div></div>`;
      bracket.appendChild(banner);
    }
    if (info && prefs.team) bracket.appendChild(teamBox(info.teamStatus(prefs.team)));

    if (ev.format === "league") { bracket.appendChild(buildLeagueHTML(ev)); return; }

    if (prefs.view === "list") { bracket.appendChild(buildMatchList(ev, info)); return; }
    // 表のときも「いま試合中」は表の上に出す
    if (info.now.length) bracket.appendChild(nowStrip(info));

    const mainMs = (ev.matches||[]).filter(m=>!m.isExhibition);
    if (mainMs.length) bracket.appendChild(window.BracketView.build(mainMs, bracketOpts(bracket)));
    if (ev.loserMatches && ev.loserMatches.length > 0) {
      const lbl = document.createElement("div");
      lbl.className = "loserLabel";
      lbl.textContent = "▊ 裏トーナメント";
      bracket.appendChild(lbl);
      bracket.appendChild(window.BracketView.build(ev.loserMatches, bracketOpts(bracket)));
    }
    // 「自動」で表が横にはみ出す（＝スマホで大きな大会）なら、読みやすい試合一覧に切り替える
    if (prefs.view === "auto" && bracket.scrollWidth > bracket.clientWidth + 4) {
      bracket.querySelectorAll("svg.bv, .loserLabel, .nowStrip").forEach(e => e.remove());
      const note = document.createElement("div");
      note.className = "autoNote";
      note.innerHTML = `<span>一覧で表示中</span><button type="button">トーナメント表で見る</button>`;
      note.querySelector("button").onclick = () => { prefs.view = "tree"; savePrefs(); renderCurrentEvent(); };
      bracket.appendChild(note);
      bracket.appendChild(buildMatchList(ev, info));
      return;
    }
    window.BracketView.addScrollHint(bracket);
  }

  // ── 競技ごとの情報をまとめる（一覧・表の上の要約で共通）────────
  function analyze(ev) {
    const all = [...(ev.matches||[]), ...(ev.loserMatches||[])].filter(m => !m.isExhibition);
    const key = (m) => `${m.isLoserMatch ? "L" : "R"}${m.round}-${m.slot}`;
    const real = all.filter(m => !m.isBye);
    const mainRounds = Math.max(1, ...(ev.matches||[]).filter(m => !m.isThirdPlace && !m.isExhibition).map(m => m.round));
    const loserRounds = Math.max(1, ...(ev.loserMatches||[]).map(m => m.round));
    const rName = (m) => {
      if (m.isThirdPlace) return "3位決定戦";
      const R = m.isLoserMatch ? loserRounds : mainRounds, d = R - m.round;
      const base = d === 0 ? "決勝" : d === 1 ? "準決勝" : d === 2 ? "準々決勝" : `${m.round}回戦`;
      return (m.isLoserMatch ? "裏 " : "") + base;
    };
    const label = (t) => t && t.startsWith("__L|") ? t.slice(4, -2).split("|").pop() + " の負け" : t;
    const placeholder = (m, slot) => {
      const f = all.find(x => x.nextMatchKey === key(m) && x.nextSlot === slot && !x.isBye);
      if (f) return f.matchNum ? `第${f.matchNum}試合の勝者` : "前の試合の勝者";
      if (m.isThirdPlace) return "準決勝の敗者";
      return "未定";
    };
    const nameOf = (m, side) => { const t = side === "A" ? m.teamA : m.teamB; return t ? label(t) : placeholder(m, side); };
    const byTime = (a, b) => (a.scheduledStart || "").localeCompare(b.scheduledStart || "") || (a.court || "").localeCompare(b.court || "");
    const now = real.filter(m => m.state === "playing" || m.state === "calling").sort(byTime);
    const next = real.filter(m => m.state !== "final" && m.state !== "playing" && m.state !== "calling" && m.teamA && m.teamB).sort(byTime).slice(0, 3);
    // 最終順位
    const main = (ev.matches||[]).filter(m => !m.isExhibition && !m.isBye);
    const fin = main.find(m => !m.isThirdPlace && m.round === mainRounds);
    const tp = main.find(m => m.isThirdPlace);
    let podium = null;
    if (fin && fin.state === "final" && fin.winner) {
      const w = (m) => m.winner === "A" ? m.teamA : m.teamB, l = (m) => m.winner === "A" ? m.teamB : m.teamA;
      const thirds = tp ? (tp.state === "final" && tp.winner ? [w(tp)] : [])
        : main.filter(m => !m.isThirdPlace && m.round === mainRounds - 1 && m.state === "final" && m.winner).map(l);
      podium = { first: label(w(fin)), second: label(l(fin)), thirds: thirds.filter(Boolean).map(label) };
    }
    // 自分のクラスの状況
    const teamStatus = (team) => {
      if (!team) return null;
      const mine = real.filter(m => m.teamA === team || m.teamB === team).sort(byTime);
      if (!mine.length) return { kind: "none", text: "この競技には出場していません", matches: [] };
      const opp = (m) => m.teamA === team ? nameOf(m, "B") : nameOf(m, "A");
      const where = (m) => [m.matchNum ? `第${m.matchNum}試合` : "", fmtTime(m.scheduledStart), m.court ? m.court + "コート" : ""].filter(Boolean).join(" ");
      if (podium && podium.first === team) return { kind: "win", text: "🏆 優勝！おめでとう！", matches: mine };
      const live = mine.find(m => m.state === "playing" || m.state === "calling");
      if (live) return { kind: "live", text: `${live.state === "calling" ? "📢 招集中" : "🔴 試合中"}：${where(live)} vs ${opp(live)}`, matches: mine };
      const lostM = mine.find(m => m.state === "final" && m.winner && (m.winner === "A" ? m.teamB : m.teamA) === team && !m.isLoserMatch && !m.isThirdPlace);
      const upcoming = mine.find(m => m.state !== "final");
      if (upcoming) return { kind: "next", text: `次の試合：${where(upcoming)} vs ${opp(upcoming)}`, matches: mine };
      // 勝ち上がり先がまだ決まっていない（相手待ち）
      const lastWin = [...mine].reverse().find(m => m.state === "final" && (m.winner === "A" ? m.teamA : m.teamB) === team);
      if (lostM) {
        const sc = lostM.scoreA != null ? ` ${lostM.teamA === team ? lostM.scoreA : lostM.scoreB}-${lostM.teamA === team ? lostM.scoreB : lostM.scoreA}` : "";
        const rank = podium && podium.second === team ? "準優勝" : podium && podium.thirds.includes(team) ? "3位" : "";
        return { kind: "out", text: rank ? `🥈 ${rank}（${rName(lostM)} vs ${opp(lostM)}${sc}）` : `${rName(lostM)}で敗退（vs ${opp(lostM)}${sc}）`, matches: mine };
      }
      if (lastWin) return { kind: "next", text: `勝ち残り中：次の対戦相手を待っています`, matches: mine };
      return { kind: "next", text: "試合予定を確認中", matches: mine };
    };
    return { all, real, key, rName, label, nameOf, placeholder, byTime, now, next, podium, teamStatus, mainRounds };
  }

  // 試合カード（一覧用）
  function matchCard(info, m) {
    const st = m.state === "final" ? "final" : m.state === "playing" ? "playing" : m.state === "calling" ? "calling" : "waiting";
    const stTxt = { final: "終了", playing: "試合中", calling: "招集中", waiting: "これから" }[st];
    const row = (side, team, score) => {
      const won = m.winner === side, lost = m.winner && !won;
      const cls = ["mcRow", won ? "win" : lost ? "lose" : "", team ? "" : "tbd", prefs.team && team === prefs.team ? "mine" : ""].join(" ");
      const sc = (m.state === "final" || m.state === "playing") && score != null && score !== "" ? score : "";
      return `<div class="${cls}"><span class="nm">${escapeHtml(info.nameOf(m, side))}</span><span class="sc">${sc}</span></div>`;
    };
    const d = document.createElement("div");
    d.className = "mc st-" + st;
    d.innerHTML = `<div class="mcHead"><span class="rn">${escapeHtml(info.rName(m))}</span>${m.matchNum ? `<span>第${m.matchNum}試合</span>` : ""}<span class="t">${fmtTime(m.scheduledStart) || ""}</span>${m.court ? `<span>${escapeHtml(m.court)}コート</span>` : ""}<span class="stTag ${st}">${stTxt}</span></div>`
      + row("A", m.teamA, m.scoreA) + row("B", m.teamB, m.scoreB);
    return d;
  }
  // 終了した試合（1行）
  function resultLine(info, m) {
    const d = document.createElement("div");
    const w = m.winner === "A" ? "A" : "B", l = w === "A" ? "B" : "A";
    const sw = w === "A" ? m.scoreA : m.scoreB, sl = w === "A" ? m.scoreB : m.scoreA;
    const mineW = prefs.team && (w === "A" ? m.teamA : m.teamB) === prefs.team, mineL = prefs.team && (l === "A" ? m.teamA : m.teamB) === prefs.team;
    d.className = "rl" + (mineW || mineL ? " mine" : "");
    const hasSc = sw != null && sw !== "" && sl != null && sl !== "";
    d.innerHTML = `<span class="rlNum">${m.matchNum ? "第" + m.matchNum : ""}</span><span class="rlW">${escapeHtml(info.nameOf(m, w))}</span>`
      + `<span class="rlS">${hasSc ? `${sw}<i>-</i>${sl}` : `<i>○-×</i>`}</span><span class="rlL">${escapeHtml(info.nameOf(m, l))}</span>`;
    return d;
  }
  // 最終順位
  function podiumBox(p) {
    const d = document.createElement("div");
    d.className = "podium";
    d.innerHTML = `<div class="pd1"><span>🏆 優勝</span><b>${escapeHtml(p.first)}</b></div>`
      + `<div class="pd2"><span>🥈 準優勝</span><b>${escapeHtml(p.second || "-")}</b></div>`
      + (p.thirds.length ? `<div class="pd3"><span>🥉 3位</span><b>${p.thirds.map(escapeHtml).join("・")}</b></div>` : "");
    return d;
  }
  // 自分のクラスの要約
  function teamBox(ts) {
    const d = document.createElement("div");
    d.className = "teamBox k-" + ts.kind;
    d.innerHTML = `<div class="tbHead">👤 ${escapeHtml(prefs.team)}</div><div class="tbText">${escapeHtml(ts.text)}</div>`;
    return d;
  }
  // 「いま試合中」の簡易表示（表のとき用）
  function nowStrip(info) {
    const d = document.createElement("div");
    d.className = "nowStrip";
    d.innerHTML = info.now.map(m => `<div class="ns"><span class="stTag ${m.state === "calling" ? "calling" : "playing"}">${m.state === "calling" ? "招集中" : "試合中"}</span>`
      + `<span>${m.court ? escapeHtml(m.court) + "コート" : ""} ${m.matchNum ? "第" + m.matchNum + "試合" : ""}</span>`
      + `<b>${escapeHtml(info.nameOf(m, "A"))} <i>vs</i> ${escapeHtml(info.nameOf(m, "B"))}</b></div>`).join("");
    return d;
  }

  // ── 試合一覧（スマホ向け）────────────────────────
  function buildMatchList(ev, info = analyze(ev)) {
    const wrap = document.createElement("div");
    wrap.className = "ml";
    const sec = (title, sub, cls = "") => { const h = document.createElement("div"); h.className = "mlSec " + cls; h.innerHTML = escapeHtml(title) + (sub ? ` <small>${escapeHtml(sub)}</small>` : ""); wrap.appendChild(h); };

    if (info.now.length) { sec("🔴 いま試合中・招集中"); info.now.forEach(m => wrap.appendChild(matchCard(info, m))); }
    if (info.next.length) { sec("⏭ 次の試合", "時間順"); info.next.forEach(m => wrap.appendChild(matchCard(info, m))); }
    if (prefs.team) {
      const ts = info.teamStatus(prefs.team);
      if (ts.matches.length) { sec(`👤 ${prefs.team} の試合`); ts.matches.forEach(m => wrap.appendChild(m.state === "final" ? resultLine(info, m) : matchCard(info, m))); }
    }

    // 回戦ごと。全試合終了の回戦は1行表示に縮める
    sec("📋 全試合");
    const order = (m) => (m.isLoserMatch ? 100 : 0) + (m.isThirdPlace ? info.mainRounds - 0.5 : m.round);
    const groups = [];
    [...info.real].sort((a, b) => order(a) - order(b) || info.byTime(a, b)).forEach(m => {
      const n = info.rName(m);
      if (!groups.length || groups[groups.length - 1].name !== n) groups.push({ name: n, list: [] });
      groups[groups.length - 1].list.push(m);
    });
    for (const g of groups) {
      const fin = g.list.filter(m => m.state === "final").length;
      const allDone = fin === g.list.length;
      const h = document.createElement("div");
      h.className = "mlRound" + (g.name === "決勝" ? " final" : "");
      h.innerHTML = `${escapeHtml(g.name)} <small>${allDone ? "すべて終了" : `${fin}/${g.list.length} 終了`}</small>`;
      wrap.appendChild(h);
      g.list.forEach(m => wrap.appendChild(m.state === "final" && m.winner ? resultLine(info, m) : matchCard(info, m)));
    }
    if (!info.real.length) wrap.innerHTML = `<div class="emptyNote">試合がありません</div>`;
    return wrap;
  }

  // リーグ戦: 点数が空欄の試合を 0-0 の引き分けとして数えない（空欄なら勝敗 winner で数える）
  function addLeagueResult(res, m) {
    if (!m.teamA || !m.teamB || m.state !== "final") return;
    const A = res[m.teamA], B = res[m.teamB]; if (!A || !B) return;
    const has = (v) => v !== "" && v != null && Number.isFinite(Number(v));
    let a = null, b = null; if (has(m.scoreA) && has(m.scoreB)) { a = Number(m.scoreA); b = Number(m.scoreB); }
    if (a != null) { A.gf += a; A.ga += b; B.gf += b; B.ga += a; A.gd = (A.gd||0) + a - b; B.gd = (B.gd||0) + b - a; }
    const w = m.draw ? null : a != null && a !== b ? (a > b ? "A" : "B") : (m.winner || null);
    if (w === "A") { A.pts += 3; A.w++; B.l++; } else if (w === "B") { B.pts += 3; B.w++; A.l++; }
    else if (a != null || m.draw) { A.pts++; A.d++; B.pts++; B.d++; }
  }

  // 決勝（最終ラウンド）の勝者を返す。未確定なら null
  function getChampion(ev) {
    if (!ev || ev.format === "league") {
      // リーグは首位を優勝扱い（全試合終了時のみ）
      if (ev?.format === "league") {
        const ms = (ev.matches||[]);
        if (ms.length && ms.every(m=>m.state==="final")) return leagueLeader(ev);
      }
      return null;
    }
    const ms = (ev.matches||[]).filter(m=>!m.isExhibition && !m.isThirdPlace);
    if (!ms.length) return null;
    const maxRound = Math.max(...ms.map(m=>m.round));
    const finalM = ms.find(m=>m.round===maxRound);
    if (finalM && finalM.state==="final" && finalM.winner) {
      return finalM.winner==="A" ? finalM.teamA : finalM.teamB;
    }
    return null;
  }
  function leagueLeader(ev) {
    const teams = new Set();
    ev.matches.forEach(m=>{ if(m.teamA)teams.add(m.teamA); if(m.teamB)teams.add(m.teamB); });
    const res = {}; [...teams].forEach(t=>res[t]={pts:0,gd:0,gf:0,ga:0,w:0,d:0,l:0});
    ev.matches.forEach(m => addLeagueResult(res, m));
    const sorted=[...teams].sort((x,y)=>(res[y].pts-res[x].pts)||(res[y].gd-res[x].gd));
    return sorted[0] || null;
  }

  // ── League table ──────────────────────────
  function buildLeagueHTML(ev) {
    const wrap = document.createElement("div");
    wrap.className = "leagueWrap";
    const teams = new Set();
    ev.matches.forEach(m => { if(m.teamA)teams.add(m.teamA); if(m.teamB)teams.add(m.teamB); });
    const arr = [...teams].sort();
    const results = {};
    arr.forEach(t => results[t] = {pts:0,w:0,d:0,l:0,gf:0,ga:0,gd:0});
    ev.matches.forEach(m => addLeagueResult(results, m));
    const ranked = arr.slice().sort((a,b)=>(results[b].pts-results[a].pts)||(results[b].gf-results[b].ga-(results[a].gf-results[a].ga)));
    const tbl = document.createElement("table");
    tbl.className = "league-table";
    tbl.innerHTML = `<thead><tr><th>#</th><th>チーム</th><th>勝点</th><th>勝</th><th>分</th><th>負</th><th>得点</th><th>失点</th></tr></thead>`;
    const tbody = document.createElement("tbody");
    ranked.forEach((t,i) => {
      const r = results[t];
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${i+1}</td><td style="text-align:left;font-weight:700;">${escapeHtml(t)}</td><td style="font-weight:800;color:#1d4ed8;">${r.pts}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    return wrap;
  }

  // ── Auto-refresh every 15s from localStorage (same device) ──
  setInterval(() => {
    if (mode === "fb") return;
    try {
      const raw = localStorage.getItem("classmatch_local_v2_state");
      if (!raw) return;
      const newState = JSON.parse(raw);
      const newTs = newState?.tournament?.updatedAt;
      const curTs = state?.tournament?.updatedAt;
      if (newTs && newTs !== curTs) {
        state = newState;
        renderAll();
      }
    } catch {}
  }, 5000);

  let _rt = null;
  window.addEventListener("resize", () => { clearTimeout(_rt); _rt = setTimeout(() => { if (state) renderCurrentEvent(); }, 200); });

  // ── Kick off ───────────────────────────────
  loadState();
})();
</script>
