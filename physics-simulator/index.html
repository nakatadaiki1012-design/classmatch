<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物理ラボ3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="高校物理（物理基礎・物理）の現象を3Dで動かして学べるシミュレーター">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* レイアウト：左に実験の一覧、まん中に3Dの実験室、右に操作と説明のパネル（理科の実験ノート：紙・墨・緑青・朱） */
:root {
  --bg: #f1ede4; --panel: #fbf9f4; --glass: rgba(251, 249, 244, 0.95); --ink: #24282b; --muted: #6d6b63; --line: #d6d0c2; --chip: #ebe6da;

  --vel: #2f5f9e; --force: #b8502c; --acc: #7a4fa0; --ke: #d08a1e; --pe: #2f7f9e;
  --bench-1: #faf8f2; --bench-2: #e4dfd3;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-data: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18201c; --panel: #1f2924; --glass: rgba(31, 41, 36, 0.95); --ink: #ebe8dd; --muted: #a3a89b; --line: #36443c; --chip: #28342e;
    --accent: #8cc5a6; --accent-ink: #18201c; --warm: #eda26b; --ok: #8cc5a6; --ng: #eda26b; --stamp: #f07a6a;
    --vel: #8fb5e8; --force: #f0906a; --acc: #c9a2ea; --ke: #f0c060; --pe: #7fc6e0;
    --bench-1: #26332d; --bench-2: #121915; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18201c; --panel: #1f2924; --glass: rgba(31, 41, 36, 0.95); --ink: #ebe8dd; --muted: #a3a89b; --line: #36443c; --chip: #28342e;
  --accent: #8cc5a6; --accent-ink: #18201c; --warm: #eda26b; --ok: #8cc5a6; --ng: #eda26b; --stamp: #f07a6a;
  --vel: #8fb5e8; --force: #f0906a; --acc: #c9a2ea; --ke: #f0c060; --pe: #7fc6e0;
  --bench-1: #26332d; --bench-2: #121915; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden;
  background-color: var(--bg); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
body::before { content: ""; position: fixed; inset: 0; background: var(--bg); opacity: .82; pointer-events: none; z-index: -1; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
sub, sup { font-size: .68em; line-height: 0; }
var { font-family: var(--font-display); font-style: italic; font-weight: 700; }
.top { display: flex; align-items: center; gap: 12px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1.5px solid var(--ink); background: var(--panel); }
.brand { font-family: var(--font-display); font-weight: 800; letter-spacing: .04em; font-size: 18px; margin: 0; white-space: nowrap; }
.brand b { color: var(--warm); }
.modes { display: flex; gap: 2px; }
.modes button { border: 0; background: transparent; padding: 3px 14px; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.modes button[aria-current="true"] { color: var(--ink); box-shadow: inset 0 -2.5px 0 var(--warm); }
.back { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border: 1px solid var(--ink); border-radius: 3px; font-size: 13px; font-weight: 700; color: var(--ink); text-decoration: none; white-space: nowrap; }
.back svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.app { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: 236px minmax(0, 1fr) 360px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lib { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow-y: auto; padding: 10px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.cat { border: 1px solid var(--line); background: var(--panel); border-radius: 3px; padding: 4px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.cat small { margin-left: 4px; font-family: var(--font-data); font-weight: 500; font-size: 10.5px; opacity: .8; }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.items { display: flex; flex-direction: column; gap: 2px; }
.libfoot { font-size: 12px; color: var(--muted); margin: auto 4px 0; }
.grp { font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 8px 4px 2px; }
.item { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 6px 8px; font-size: 14px; line-height: 1.35; }
.item:hover { background: var(--chip); }
.item[aria-current="true"] { background: var(--chip); border-color: var(--accent); font-weight: 700; }
.item .ic { width: 24px; height: 22px; border-radius: 4px; background: var(--chip); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--accent); flex: none; font-family: var(--font-display); }
.item[aria-current="true"] .ic { background: var(--accent); color: var(--accent-ink); }
.item .done { margin-left: auto; color: var(--ok); font-weight: 700; }
.stage-wrap { position: relative; border-radius: var(--r); overflow: hidden; min-height: 0; border: 1px solid var(--line); background: radial-gradient(120% 90% at 40% 30%, var(--bench-1), var(--bench-2)); }
.stage-wrap.space { background: radial-gradient(120% 90% at 40% 30%, #1d2a35, #05080c); }
.stage-wrap.is-max { position: fixed; inset: 0; z-index: 50; border-radius: 0; }
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; font-size: 12.5px; font-weight: 700; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 3px; padding: 0 7px; line-height: 20px; font-family: var(--font-data); }
.lbl.v { color: var(--vel); border-color: var(--vel); }
.lbl.f { color: var(--force); border-color: var(--force); }
.lbl.a { color: var(--acc); border-color: var(--acc); }
.lbl.k { color: var(--accent); border-color: var(--accent); }
.lbl.warn { background: var(--ng); color: var(--panel); border-color: var(--ng); }
.lbl.plain { background: transparent; border-color: transparent; color: var(--muted); font-weight: 600; }
.ov { position: absolute; z-index: 2; display: flex; gap: 6px; }
.ov-tl { top: 10px; left: 10px; flex-wrap: wrap; max-width: calc(100% - 150px); }
.ov-tr { top: 10px; right: 10px; }
.ov-bc { bottom: 10px; left: 50%; transform: translateX(-50%); align-items: center; background: var(--glass); border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
.ibtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); }
.ov-bc .ibtn { width: 34px; height: 30px; border-color: transparent; background: transparent; }
.ibtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ibtn svg .fill { fill: currentColor; stroke: none; }
.ibtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.speed { display: flex; gap: 0; border-left: 1px solid var(--line); padding-left: 4px; }
.speed button { border: 0; background: transparent; padding: 3px 8px; font: 600 12.5px var(--font-data); color: var(--muted); border-radius: 3px; }
.speed button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--warm); }
.clock { white-space: nowrap; font: 600 13px var(--font-data); padding: 0 8px; min-width: 6.2em; text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; background: var(--glass); border: 1px solid var(--line); border-radius: 3px; padding: 4px 9px; font-size: 12px; font-weight: 700; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; background: currentColor; position: relative; }
.legend i::after { content: ""; position: absolute; right: -4px; top: -3px; border-left: 6px solid currentColor; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.legend .v { color: var(--vel); } .legend .f { color: var(--force); } .legend .a { color: var(--acc); }
.toast { position: absolute; z-index: 60; left: 8px; right: 8px; bottom: 54px; margin: 0; padding: 6px 12px 6px 10px; border-radius: 4px; font-size: 13.5px; font-weight: 700; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,.15); border-left: 5px solid rgba(0,0,0,.25); cursor: pointer; transition: opacity .3s; }
.toast.ok { background: var(--ok); color: var(--accent-ink); } .toast.ng { background: var(--ng); color: var(--panel); } .toast.info { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-left-width: 5px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; min-width: 0; min-height: 0; }
.card-head { padding: 10px 14px 2px; display: flex; align-items: flex-start; gap: 8px; }
.card-head > div:first-child { flex: 1; min-width: 0; }
.eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.name { font-family: var(--font-display); font-weight: 800; font-size: 23px; line-height: 1.25; margin: 2px 0 0; letter-spacing: .02em; text-wrap: balance; }
.lead { font-size: 13px; color: var(--muted); margin: 2px 0 0; line-height: 1.5; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin: 8px 14px 0; border-bottom: 1px solid var(--line); }
.tabs button { white-space: nowrap; border: 0; background: transparent; padding: 5px 4px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2.5px 0 var(--accent); }
.body { overflow-y: auto; padding: 10px 14px 0; flex: 1; min-height: 0; }
.body::after { content: ""; display: block; height: 14px; }
.ctl { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
.btn:not(:disabled):hover { border-color: var(--accent); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 2px 2px 0 var(--ink); }
.btn.main:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--chip); color: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; width: fit-content; max-width: 100%; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--panel); padding: 4px 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.segrow { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13.5px; }
.sl { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) 4.6em; gap: 8px; align-items: center; font-size: 13.5px; }
.sl label var, .segrow var { font-size: 1.05em; }
.sl input { accent-color: var(--accent); width: 100%; }
.sl output { font-family: var(--font-data); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chk { display: flex; flex-wrap: wrap; gap: 4px; }
.chk button { border: 1px solid var(--line); background: var(--panel); border-radius: 3px; padding: 2px 9px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.chk button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--chip); }
.chk button[aria-pressed="true"]::before { content: "✓ "; }
.meter { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.meter div { background: var(--panel); padding: 3px 8px 4px; min-width: 0; }
.meter small { display: block; font-size: 11px; color: var(--muted); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter b { display: block; font: 600 15px var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter b.hl { color: var(--warm); }
.graph { border: 1px solid var(--line); border-radius: 3px; padding: 4px 4px 0; }
.graph-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 4px; }
.graph-h .key { display: flex; gap: 8px; flex-wrap: wrap; }
.graph-h .key span::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 4px; vertical-align: 3px; background: var(--c); }
.graph svg { display: block; width: 100%; height: auto; color: var(--ink); }
.bars { display: grid; gap: 4px; font-size: 12.5px; }
.bars .b { display: grid; grid-template-columns: 8em minmax(0, 1fr) 4.6em; gap: 8px; align-items: center; }
.bars .t { height: 10px; background: var(--chip); border-radius: 2px; overflow: hidden; }
.bars .t i { display: block; height: 100%; background: var(--c, var(--accent)); transition: width .08s linear; }
.bars output { font-family: var(--font-data); text-align: right; font-variant-numeric: tabular-nums; }
.formula { font-family: var(--font-display); font-size: 17px; font-weight: 700; background: var(--chip); border-radius: 2px; padding: 6px 10px; margin: 6px 0; line-height: 1.7; overflow-x: auto; }
.formula small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--muted); }
.purpose { background: var(--chip); border-left: 3px solid var(--accent); border-radius: 2px; padding: 8px 10px; margin: 8px 0; font-size: 14px; line-height: 1.65; }
.purpose > b:first-child { display: block; font-size: 12px; color: var(--accent); }
.verdict { border-radius: 2px; padding: 7px 10px; font-weight: 700; font-size: 14px; background: var(--chip); border-left: 4px solid var(--warm); }
.verdict.ok { border-left-color: var(--ok); color: var(--ok); }
.verdict.ng { border-left-color: var(--ng); color: var(--ng); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.txt { font-size: 14px; margin: 0 0 8px; }
h3.sub { font-size: 13px; color: var(--muted); margin: 10px 0 2px; letter-spacing: .04em; font-family: var(--font-display); }
ul.pts { list-style: none; margin: 0; padding: 0; font-size: 14px; }
ul.pts li { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
ul.pts li b { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: var(--panel); margin-top: 2px; background: var(--accent); }
ul.pts li b.x { background: var(--warm); }
.ls-exam { border-left: 3px double var(--warm); padding: 4px 10px; margin: 10px 0 4px; font-size: 14px; }
.ls-exam h3 { margin: 0 0 2px; font-size: 13px; color: var(--warm); font-family: var(--font-display); }
.qtext { font-size: 16.5px; font-weight: 700; line-height: 1.6; margin: 2px 0 8px; }
.qchoices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.qc { border: 1.5px solid var(--line); background: var(--panel); border-radius: 4px; padding: 9px 8px; font-size: 14.5px; font-weight: 700; min-height: 46px; line-height: 1.45; }
.qc:not(:disabled):hover { border-color: var(--accent); }
.qc:disabled { opacity: 1; }
.qc.right { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .qc.wrong { color: var(--warm); border-color: var(--warm); } .qc.dim { opacity: .5; }
.qprog { height: 6px; background: var(--chip); overflow: hidden; margin: 6px 0; }
.qprog i { display: block; height: 100%; background: var(--accent); }
.ans { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ans input { width: 8em; font-family: var(--font-data); font-size: 18px; font-weight: 600; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); }
.ans .u { font-family: var(--font-data); font-size: 15px; }
ol.sol { margin: 6px 0 0; padding-left: 22px; font-size: 14px; }
ol.sol li { margin-bottom: 4px; }
.stamp { display: inline-grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: var(--stamp); border: 3px solid var(--stamp); border-radius: 50%; line-height: 1; transform: rotate(-12deg); width: 72px; height: 72px; font-size: 21px; margin: 4px 0 10px; box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 4.5px var(--stamp); }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
@media (max-width: 1200px) { .app { grid-template-columns: 196px minmax(0, 1fr) 340px; } }
@media (max-width: 900px) {
  .app { display: flex; flex-direction: column; gap: 6px; padding-block: 6px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .lib { flex: none; padding: 6px; gap: 6px; overflow: visible; }
  .cats { display: flex; overflow-x: auto; padding-bottom: 6px; }
  .cat { padding: 3px 10px; }
  .items { flex-direction: row; overflow-x: auto; gap: 6px; }
  .libfoot, .grp { display: none; }
  .item { flex: 0 0 auto; width: auto; white-space: nowrap; border-color: var(--line); }
  .stage-wrap { flex: 1 1 0; min-height: 200px; }
  .card { flex: 0 1 auto; max-height: 48%; min-height: 0; }
  .card-head { padding: 6px 12px 0; }
  .name { font-size: 18px; }
  .lead { display: none; }
  .tabs { margin: 6px 12px 0; }
  .body { padding: 8px 12px 10px; }
  .modes button { padding: 3px 9px; }

  .back .l { display: none; }
  .ov-tl { max-width: calc(100% - 100px); }
  .ov-bc { padding: 2px; gap: 2px; }
  .ov-bc .ibtn { width: 30px; }
  .speed button { padding: 3px 5px; }
  .clock { min-width: 0; padding: 0 4px; font-size: 12px; }
  .legend { font-size: 11px; padding: 2px 6px; }
}

</style>

<body>
<header class="top">
  <h1 class="brand">物理ラボ<b>3D</b></h1>
  <nav class="modes" id="modes" aria-label="モード">
    <button type="button" data-mode="sim" aria-current="true" title="現象を3Dで動かす">実験</button>
    <button type="button" data-mode="drill" aria-current="false" title="数字が毎回変わる計算問題">計算</button>
    <button type="button" data-mode="quiz" aria-current="false" title="考え方のクイズ">クイズ</button>
  </nav>
  <a class="back" href="https://nakatadaiki1012-design.github.io/chemistry-simulator/" target="_blank" rel="noopener" title="分子ラボ3D（化学）を開く（新しいタブ）"><span class="l">分子ラボ3D</span><span>化学</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
</header>
<main class="app">
  <aside class="lib" id="lib" aria-label="実験をえらぶ"></aside>
  <section class="stage-wrap" id="stageWrap" aria-label="3Dの実験室">
    <div id="stage"></div>
    <div class="labels" id="labels"></div>

// ===== グラフ（SVG） =====
function niceStep(range, n) {
  const raw = range / (n || 4), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;

// o = { w, h, x:[min,max], y:[min,max], xl, yl, series:[{pts, c, dash, w, dots, area}], marks:[{x?, y?, c, label}], pt:[{x,y,c}] }
function plot(o) {
  const w = o.w || 320, h = o.h || 150, L = 38, Rr = 10, T = 12, B = 22;
  const [x0, x1] = o.x, [y0, y1] = o.y;
  const X = v => L + (v - x0) / ((x1 - x0) || 1) * (w - L - Rr), Y = v => h - B - (v - y0) / ((y1 - y0) || 1) * (h - T - B);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.yl || '')} と ${esc(o.xl || '')} のグラフ">`;
  const sx = niceStep(x1 - x0, o.nx || 4), sy = niceStep(y1 - y0, o.ny || 3);
  const dx = Math.max(0, -Math.floor(Math.log10(sx) + 1e-9)), dy = Math.max(0, -Math.floor(Math.log10(sy) + 1e-9));
  for (let v = Math.ceil(x0 / sx) * sx; v <= x1 + 1e-9; v += sx) s += `<line x1="${X(v).toFixed(1)}" y1="${T}" x2="${X(v).toFixed(1)}" y2="${h - B}" stroke="currentColor" stroke-opacity=".08"/><text x="${X(v).toFixed(1)}" y="${h - B + 12}" font-size="9" text-anchor="middle" fill="currentColor" fill-opacity=".7">${fmt(v, dx)}</text>`;
  for (let v = Math.ceil(y0 / sy) * sy; v <= y1 + 1e-9; v += sy) s += `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${w - Rr}" y2="${Y(v).toFixed(1)}" stroke="currentColor" stroke-opacity="${Math.abs(v) < 1e-9 ? .35 : .08}"/><text x="${L - 4}" y="${(Y(v) + 3).toFixed(1)}" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".7">${fmt(v, dy)}</text>`;
  s += `<line x1="${L}" y1="${T}" x2="${L}" y2="${h - B}" stroke="currentColor" stroke-opacity=".45"/><line x1="${L}" y1="${h - B}" x2="${w - Rr}" y2="${h - B}" stroke="currentColor" stroke-opacity=".45"/>`;
  s += `<text x="${w - Rr}" y="${h - 2}" font-size="9.5" text-anchor="end" fill="currentColor" fill-opacity=".8">${o.xl || ''}</text><text x="${L + 4}" y="${T - 3}" font-size="9.5" fill="currentColor" fill-opacity=".8">${o.yl || ''}</text>`;
  const cid = 'gc' + (plot.n = (plot.n || 0) + 1) % 1000;
  s += `<clipPath id="${cid}"><rect x="${L}" y="${T - 2}" width="${w - L - Rr}" height="${h - T - B + 4}"/></clipPath><g clip-path="url(#${cid})">`;
  (o.marks || []).forEach(m => {
    if (m.x !== undefined) s += `<line x1="${X(m.x).toFixed(1)}" y1="${T}" x2="${X(m.x).toFixed(1)}" y2="${h - B}" style="stroke:${m.c || 'currentColor'}" stroke-dasharray="3 3" stroke-opacity=".8"/>` + (m.label ? `<text x="${(X(m.x) + 3).toFixed(1)}" y="${T + 9}" font-size="9" style="fill:${m.c || 'currentColor'}">${m.label}</text>` : '');
    if (m.y !== undefined) s += `<line x1="${L}" y1="${Y(m.y).toFixed(1)}" x2="${w - Rr}" y2="${Y(m.y).toFixed(1)}" style="stroke:${m.c || 'currentColor'}" stroke-dasharray="3 3" stroke-opacity=".8"/>` + (m.label ? `<text x="${w - Rr - 2}" y="${(Y(m.y) - 3).toFixed(1)}" font-size="9" text-anchor="end" style="fill:${m.c || 'currentColor'}">${m.label}</text>` : '');
  });
  (o.series || []).forEach(se => {
    if (!se.pts.length) return;
    const step = Math.max(1, Math.floor(se.pts.length / 400));
    let d = '';
    for (let i = 0; i < se.pts.length; i += step) { const p = se.pts[i]; d += (d ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(clamp(p[1], y0 - (y1 - y0), y1 + (y1 - y0))).toFixed(1); }
    const last = se.pts[se.pts.length - 1];
    d += 'L' + X(last[0]).toFixed(1) + ' ' + Y(clamp(last[1], y0 - (y1 - y0), y1 + (y1 - y0))).toFixed(1);
    if (se.area) s += `<path d="${d}L${X(last[0]).toFixed(1)} ${Y(Math.max(y0, 0)).toFixed(1)}L${X(se.pts[0][0]).toFixed(1)} ${Y(Math.max(y0, 0)).toFixed(1)}Z" style="fill:${se.c}" fill-opacity=".12"/>`;
    s += `<path d="${d}" fill="none" style="stroke:${se.c}" stroke-width="${se.w || 2}" stroke-linejoin="round"${se.dash ? ' stroke-dasharray="4 3"' : ''}/>`;
    if (se.end !== false && !se.dash) s += `<circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3" style="fill:${se.c}"/>`;
  });
  (o.pt || []).forEach(p => { s += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.r || 3.5}" style="fill:${p.c || 'currentColor'}"/>` + (p.label ? `<text x="${(X(p.x) + 6).toFixed(1)}" y="${(Y(p.y) - 5).toFixed(1)}" font-size="9" style="fill:${p.c || 'currentColor'}">${p.label}</text>` : ''); });
  return s + '</g></svg>';
}
// グラフ用の記録（一定の時間ごとに1点）
function recorder(every, max) {

function defaults(def) { const p = {}; (def.params || []).forEach(q => { p[q.k] = q.v; }); return Object.assign(p, JSON.parse(JSON.stringify(def.p0 || {}))); }

  },

    <p class="txt">ストロボの間かくを見ると、落ちるほど間が広がる。0.2 秒ごとに進む距離が、1 : 3 : 5 : 7 … とふえていく（自由落下のとき）。</p>

// ---------- 水平投射・斜方投射 ----------
sim({
  id: 'proj', cat: '力学', icon: '投', name: '放物運動（斜方投射）',
  lead: '横はそのまま、たては投げ上げ。2つの運動を重ねると放物線になる。',
  params: [
    { k: 'v0', label: '初速度 <var>v</var><sub>0</sub>', min: 4, max: 25, step: 0.5, v: 14, unit: 'm/s', reset: true },
    { k: 'th', label: '角度 <var>θ</var>', min: 0, max: 90, step: 1, v: 45, unit: '°', reset: true },
    { k: 'h0', label: '高さ <var>h</var>', min: 0, max: 10, step: 0.5, v: 0, unit: 'm', reset: true },
  ],
  p0: { g: 9.8, strobe: true, comp: true, shadow: true, gmode: 'v' },
  legend: [['v', '速度とその成分 vx・vy']],
  init(s) {
    const p = s.p, g = R.group, th = p.th * DEG;
    s.vx0 = p.v0 * Math.cos(th); s.vy0 = p.v0 * Math.sin(th);
    const tl = (s.vy0 + Math.sqrt(s.vy0 * s.vy0 + 2 * p.g * p.h0)) / p.g;
    s.Rng = s.vx0 * tl; s.Hmax = p.h0 + s.vy0 * s.vy0 / (2 * p.g); s.tl = tl;
    s.span = Math.max(6, s.Rng, s.Hmax * 1.4);
    s.r = clamp(s.span * 0.012, 0.1, 0.32);

    // 台と発射台
    if (p.h0 > 0) { const t = roundBox(1.6, p.h0, 1.4, 0.06, solid(0xb39b78, { shininess: 10 })); t.position.set(-0.4, p.h0 / 2, 0); g.add(t); g.add(contactShadow(2.4, 2.2, 0.45)).position.x = -0.4; }
    const base = new THREE.Group(); base.position.set(0, p.h0, 0); g.add(base);
    const k = s.span / 14;
    const wheelM = solid(0x4a3a2c, { shininess: 20 });
    [-0.3, 0.3].forEach(z => { const w = cyl(0.32 * k, 0.32 * k, 0.08 * k, wheelM, 24); w.rotation.x = Math.PI / 2; w.position.set(-0.15 * k, 0.32 * k, z * k); base.add(w); });
    const barrel = new THREE.Group(); barrel.position.set(-0.15 * k, 0.42 * k, 0); base.add(barrel);
    const tube = cyl(0.13 * k, 0.17 * k, 1.1 * k, metal(0x50565e, 0.35), 24); tube.rotation.z = -Math.PI / 2; tube.position.x = 0.35 * k; barrel.add(tube);
    barrel.rotation.z = th; s.muzzle = V3(-0.15 * k + Math.cos(th) * 0.9 * k, p.h0 + 0.42 * k + Math.sin(th) * 0.9 * k, 0);
    s.x0 = s.muzzle.x; s.y0 = s.muzzle.y - p.h0 > 0 ? p.h0 : p.h0;
    // 角度の弧
    const arc = []; for (let i = 0; i <= 24; i++) { const a = th * i / 24; arc.push(V3(-0.15 * k + Math.cos(a) * 1.4 * k, p.h0 + 0.42 * k + Math.sin(a) * 1.4 * k, 0)); }
    g.add(makeLine(arc, COL.ink, 0, 0.6));
    // 後ろのかべ（たての動きの影）
    s.wallX = -1.5 - 0.2 * k;
    const wh = Math.max(s.Hmax + 1.5, 4);
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(3, wh), new THREE.MeshPhongMaterial({ map: floorTex(isDark()), transparent: true, opacity: 0.75, side: THREE.DoubleSide }));
    wall.material.map.repeat.set(3 / (10 * (s.span > 25 ? 5 : 1)), wh / (10 * (s.span > 25 ? 5 : 1)));
    wall.rotation.y = Math.PI / 2; wall.position.set(s.wallX, wh / 2, 0); wall.userData.noFit = true; g.add(wall);
    s.wall = wall;
    // ボール・影
    s.b = ball(s.r, metal(0xc8452f, 0.25)); g.add(s.b);
    s.sh = blob(s.r * 4); g.add(s.sh);
    s.pg = ball(s.r * 0.6, glow(0x2c6352, 0.85), 16); g.add(s.pg); // 床の影（横の動き）
    s.pw = ball(s.r * 0.6, glow(0xb8502c, 0.85), 16); g.add(s.pw); // かべの影（たての動き）
    s.trail = makeTrail(0xc8452f); g.add(s.trail.line);
    s.av = makeArrow(COL.vel, s.r * 0.25); s.avx = makeArrow(0x5c8fe0, s.r * 0.18); s.avy = makeArrow(0x5c8fe0, s.r * 0.18);
    [s.av, s.avx, s.avy].forEach(a => g.add(a.g));
    s.lb = addLabel('', () => s.b.position.clone().add(V3(0, s.r * 1.5, 0)), 'v');
    // 予想の軌道（点線）
    const pr = []; for (let i = 0; i <= 60; i++) { const t = tl * i / 60; pr.push(V3(s.x0 + s.vx0 * t, p.h0 + s.vy0 * t - p.g * t * t / 2 + 0.01, 0)); }
    s.pred = makeLine(pr, COL.ink, s.span * 0.012, 0.35); g.add(s.pred);
    s.x = s.x0; s.y = p.h0; s.vx = s.vx0; s.vy = s.vy0; s.top = p.h0;
    s.rec = recorder(0.02); s.nextG = 0; s.k = k;
  },
  step(s, dt) {
    const p = s.p;
    s.vy -= p.g * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    s.top = Math.max(s.top, s.y);
    s.rec.add(s.t, s.vx, s.vy, s.x, s.y);
    if (p.strobe && s.t >= s.nextG) {
      s.nextG += 0.2;
      const mk = (pos, c, r) => { const m = ball(r, new THREE.MeshPhongMaterial({ color: c, transparent: true, opacity: 0.3, depthWrite: false }), 14); m.position.copy(pos); R.group.add(m); };
      mk(V3(s.x, s.y + s.r, 0), 0xc8452f, s.r * 0.9);
      if (p.shadow) { mk(V3(s.x, 0.02, 0), 0x2c6352, s.r * 0.45); mk(V3(s.wallX + 0.02, s.y + s.r, 0), 0xb8502c, s.r * 0.45); }
    }
    if (s.y <= 0 && s.t > 0.01) { s.y = 0; s.land = s.x - s.x0; s.tland = s.t; if (p.h0 === 0) s.mem[p.v0 + ':' + p.th] = s.land; return 'stop'; }
  },
  draw(s) {
    const p = s.p;
    s.b.position.set(s.x, s.y + s.r, 0);
    s.sh.update(s.x, s.y, 0);
    if (state.running || s.trail.count === 0) s.trail.push(s.b.position);
    s.pg.visible = s.pw.visible = p.shadow;
    s.pg.position.set(s.x, 0.02, 0); s.pw.position.set(s.wallX + 0.02, s.y + s.r, 0);
    s.wall.visible = p.shadow;
    const sc = s.span / 40;
    s.av.set(s.b.position, V3(s.vx, s.vy, 0), sc);
    s.avx.set(s.b.position, V3(s.vx, 0, 0), sc); s.avy.set(s.b.position, V3(0, s.vy, 0), sc);
    s.avx.g.visible = s.avy.g.visible = p.comp && !s.ended;
    s.av.g.visible = !s.ended;
    s.lb.set(`vx ${fmt(s.vx, 1)}  vy ${fmt(s.vy, 1)}`);
    s.lb.el.hidden = !p.comp;
  },
  live(s) {
    const o = { t: fmt(s.t, 2) + ' s', x: fmt(s.x - s.x0, 2) + ' m', y: fmt(s.y, 2) + ' m', vx: fmt(s.vx, 2) + ' m/s', vy: fmt(s.vy, 2) + ' m/s', top: fmt(s.top, 2) + ' m', land: s.land !== undefined ? fmt(s.land, 2) + ' m' : `（予想 ${fmt(s.Rng, 1)} m）` };
    const T = Math.max(s.tl * 1.05, 1);
    if (s.p.gmode === 'v') {
      const vm = Math.max(s.p.v0, 3);
      o.graph = plot({ x: [0, T], y: [-vm * 1.1, vm * 1.1], xl: 't [s]', yl: 'v [m/s]', series: [{ pts: s.rec.col(1), c: C.accent }, { pts: s.rec.col(2), c: C.vel }] });
    } else {
      const span = Math.max(s.Rng, s.Hmax, 2) * 1.05;
      o.graph = plot({ x: [0, span], y: [0, Math.max(s.Hmax * 1.15, 1)], xl: 'x [m]', yl: 'y [m]', series: [{ pts: s.rec.pts.map(q => [q[3] - s.x0, q[4]]), c: C.warm }] });
    }

  },
  html(s) {
    const pairs = Object.keys(s.mem).filter(k => k.endsWith(':30') || k.endsWith(':60'));
    return `<div class="ctl">${ui.goal(s)}${ui.sliders(s, ['v0', 'th', 'h0'])}
      ${ui.chk(s, [['strobe', 'ストロボ'], ['comp', '速度の分解'], ['shadow', '床とかべに映る影']])}
      ${ui.meter([['t', '時刻 t'], ['x', '水平距離 x'], ['y', '高さ y'], ['vx', '水平成分 vx'], ['vy', '鉛直成分 vy'], ['top', '最高点'], ['land', '飛んだ距離']])}
      ${pairs.length ? `<p class="note">記録：${pairs.map(k => { const [v, a] = k.split(':'); return `${v} m/s・${a}° → ${fmt(s.mem[k], 1)} m`; }).join('　')}</p>` : ''}
      ${ui.seg(s, 'gmode', 'グラフ', [['v', 'vx・vy–t'], ['xy', '軌道 y–x']])}
      ${ui.graph(s.p.gmode === 'v' ? '速度の成分（vx は一定、vy は直線的に減る）' : '軌道（放物線）', s.p.gmode === 'v' ? [['vx', C.accent], ['vy', C.vel]] : [])}</div>`;
  },
  goal: '高さ 0・同じ初速度で、<b>30° と 60°</b> の2回投げてみよう。飛ぶ距離はどうなる？',
  goalMsg: '30° と 60° の飛距離は同じ（sin 2θ が等しい）。',
  check(s) { return Object.keys(s.mem).some(k => { const [v, a] = k.split(':'); return a === '30' && s.mem[v + ':60'] !== undefined; }); },
  how: `<p class="txt">投げた物体の運動は、<b>水平方向</b>と<b>鉛直方向</b>に分けて考える。</p>
    <ul class="pts"><li><b>横</b><span>水平方向には力がはたらかないので<b>等速直線運動</b>。<var>v<sub>x</sub></var> = <var>v</var><sub>0</sub> cos<var>θ</var> のまま。床の緑の影は等間かくで進む。</span></li>
    <li><b>縦</b><span>鉛直方向は重力だけなので<b>鉛直投げ上げ</b>と同じ。<var>v<sub>y</sub></var> = <var>v</var><sub>0</sub> sin<var>θ</var> − <var>gt</var>。かべの朱色の影は、上がって下りてくるだけ。</span></li></ul>
    <div class="formula"><var>x</var> = <var>v</var><sub>0</sub>cos<var>θ</var>·<var>t</var>　<var>y</var> = <var>v</var><sub>0</sub>sin<var>θ</var>·<var>t</var> − ½<var>gt</var><sup>2</sup><br>最高点の高さ <var>H</var> = (<var>v</var><sub>0</sub>sin<var>θ</var>)<sup>2</sup> / 2<var>g</var><br>水平到達距離 <var>L</var> = <var>v</var><sub>0</sub><sup>2</sup> sin2<var>θ</var> / <var>g</var><small>高さ 0 から投げて高さ 0 に落ちるとき。45° で最大</small></div>
    <p class="txt">角度 0° にすると<b>水平投射</b>。台の高さを変えて試してみよう。</p>`,
  points: [['o', '最高点では vy = 0。でも vx は残っているので速さは 0 ではない'], ['o', 'θ と 90°−θ では飛距離が同じ（sin2θ が同じ）'], ['x', '水平方向にも力がはたらいて減速する、はまちがい（空気抵抗なし）'], ['o', '水平投射で落ちる時間は、同じ高さから自由落下させたときと同じ']],
  exam: '最高点までの時間 t = v₀sinθ/g、到達距離、斜面や崖からの投射、2物体の衝突（同時に投げて当たる条件）がよく出る。',
  view(s) { const w = Math.max(s.Rng, 4); return [[w / 2 - 0.8, Math.max(s.Hmax, 2) * 0.45, 0], Math.max(w, s.Hmax * 1.6) * 0.62 + 1, [0.15, 0.25, 1]]; },
});

// ---------- 斜面と摩擦 ----------
sim({
  id: 'incline', cat: '力学', icon: '摩', name: '斜面と摩擦力',
  lead: '重力を斜面に平行・垂直に分ける。摩擦がたえきれなくなると、すべり出す。',
  params: [
    { k: 'th', label: '斜面の角度 <var>θ</var>', min: 0, max: 60, step: 1, v: 20, unit: '°', reset: true },
    { k: 'mu0', label: '静止摩擦係数 <var>μ</var>', min: 0, max: 1, step: 0.01, v: 0.5, reset: true },
    { k: 'mu', label: '動摩擦係数 <var>μ\'</var>', min: 0, max: 1, step: 0.01, v: 0.3, reset: true },
    { k: 'm', label: '質量 <var>m</var>', min: 0.5, max: 5, step: 0.1, v: 2, unit: 'kg', reset: true },
  ],
  p0: { vec: true, dec: true },
  legend: [['f', '力'], ['v', '速度']],
  h: 1 / 480,
  init(s) {
    const p = s.p, g = R.group, th = p.th * DEG;
    if (p.mu > p.mu0) p.mu = p.mu0;
    s.Ls = 6; // 斜面の長さ
    const W = s.Ls * Math.cos(th), Hh = s.Ls * Math.sin(th);
    s.W = W; s.Hh = Math.max(Hh, 0.001);
    const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.lineTo(W, 0); sh.lineTo(0, Math.max(Hh, 0.02)); sh.lineTo(0, 0);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: 1.8, bevelEnabled: false }); geo.translate(-W / 2, 0, -0.9);
    const wedge = new THREE.Mesh(geo, solid(0xc9b48e, { shininess: 12 })); g.add(wedge);
    if (Hh < 0.03) { wedge.visible = false; const pl = box(W, 0.06, 1.8, solid(0xc9b48e)); pl.position.y = 0.03; g.add(pl); }
    g.add(contactShadow(W + 1.5, 2.8, 0.45));
    // 角度の弧
    const arc = []; for (let i = 0; i <= 20; i++) { const a = Math.PI - th * i / 20; arc.push(V3(W / 2 + Math.cos(a) * 0.9, 0.01 + Math.sin(a) * 0.9, 0.91)); }
    g.add(makeLine(arc, COL.ink, 0, 0.7));
    const tl = textSprite('θ', 0.3, '#24282b', 'italic bold 48px "Shippori Mincho B1", serif'); tl.position.set(W / 2 - 1.15, 0.2, 0.92); g.add(tl);
    // 物体
    s.dir = V3(Math.cos(th), -Math.sin(th), 0); s.nrm = V3(Math.sin(th), Math.cos(th), 0);
    s.top = V3(-W / 2, Math.max(Hh, 0.02), 0);
    s.blk = roundBox(0.8, 0.5, 0.7, 0.05, solid(0x8a5a3a, { shininess: 25 })); s.blk.rotation.z = -th; g.add(s.blk);
    s.u = 0.7; s.v = 0; s.static = true;
    s.arG = makeArrow(COL.force, 0.035); s.arN = makeArrow(COL.force, 0.035); s.arF = makeArrow(COL.force, 0.035);
    s.arS = makeArrow(0xe0a080, 0.022); s.arC = makeArrow(0xe0a080, 0.022); s.arV = makeArrow(COL.vel, 0.035);
    [s.arG, s.arN, s.arF, s.arS, s.arC, s.arV].forEach(a => g.add(a.g));
    s.lG = addLabel('mg', () => s.arG.tip(), 'f', -14); s.lN = addLabel('N', () => s.arN.tip(), 'f'); s.lF = addLabel('f', () => s.arF.tip(), 'f');
    s.lS = addLabel('mg sinθ', () => s.arS.tip(), 'plain'); s.lC = addLabel('mg cosθ', () => s.arC.tip(), 'plain', -14);
    s.rec = recorder(0.02);
  },
  step(s, dt) {
    const p = s.p, th = p.th * DEG, g = 9.8;
    const down = g * Math.sin(th), N = g * Math.cos(th);
    if (s.v <= 1e-9) {
      s.v = 0;
      if (down > p.mu0 * N + 1e-9) s.static = false; else { s.static = true; s.fric = down; }
    }
    if (!s.static) {
      const a = down - p.mu * N;
      s.v += a * dt; s.a = a; s.fric = p.mu * N;
      if (s.v < 0) { s.v = 0; s.static = down <= p.mu0 * N; }
      s.u += s.v * dt;
    } else s.a = 0;
    s.rec.add(s.t, s.v);
    if (s.u > s.Ls - 0.5) { s.u = s.Ls - 0.5; return 'stop'; }
    if (s.static && s.t > 4) return 'stop';
  },
  draw(s) {
    const p = s.p, m = p.m, g = 9.8, th = p.th * DEG;
    const c = s.top.clone().addScaledVector(s.dir, s.u).addScaledVector(s.nrm, 0.25);
    s.blk.position.copy(c).add(V3(0, 0, 0));
    const k = 1.5 / (g);
    const N = g * Math.cos(th), f = s.fric || 0;
    s.arG.set(c, V3(0, -g, 0), k);
    s.arN.set(c.clone().addScaledVector(s.nrm, 0.25), s.nrm.clone().multiplyScalar(N), k);
    s.arF.set(c.clone().addScaledVector(s.nrm, -0.22), s.dir.clone().multiplyScalar(-f), k);

sim({

  draw(s) {

  lead: '行く波と返る波が重なって、動かない「節」と大きくゆれる「腹」ができる。',
  params: [
    { k: 'n', label: '倍振動 <var>n</var>', min: 1, max: 6, step: 1, v: 2, d: 0, fmt: v => v + (v === 1 ? '（基本）' : ' 倍'), reset: true },
    { k: 'Lr', label: '長さ <var>L</var>', min: 0.3, max: 1.2, step: 0.05, v: 0.6, unit: 'm' },
    { k: 'vs', label: '波の速さ <var>V</var>', min: 100, max: 400, step: 5, v: 340, unit: 'm/s', d: 0 },
  ],
  p0: { mode: 'string', split: false },
  rs: ['mode'],
  init(s) {
    const p = s.p, g = R.group, L = 6;
    s.L = L; s.y0 = 0.9;
    const wood = solid(0x9c7a54, { shininess: 25 });
    const bench = roundBox(L + 1, 0.12, 1.2, 0.03, wood); bench.position.y = 0.06; g.add(bench);
    g.add(contactShadow(L + 2, 2, 0.45));
    s.objs = new THREE.Group(); g.add(s.objs);
    if (p.mode === 'string') {
      [-L / 2, L / 2].forEach(x => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.12, 0.8, 3), solid(0x3a3028)); b.position.set(x, 0.52, 0); b.rotation.y = Math.PI / 2; s.objs.add(b); });
      s.geo = new THREE.TubeGeometry(new THREE.LineCurve3(V3(-L / 2, 0, 0), V3(L / 2, 0, 0)), 200, 0.022, 8, false);
      s.base = s.geo.attributes.position.array.slice();
      s.str = new THREE.Mesh(s.geo, metal(0xd8c48a, 0.5)); s.str.position.y = s.y0; s.objs.add(s.str);
    } else {
      const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, L, 48, 1, true), glassMat({ opacity: 0.2 })); tube.rotation.z = Math.PI / 2; tube.position.y = s.y0; tube.renderOrder = 3; s.objs.add(tube);
      [-1, 1].forEach(q => { const r = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.02, 8, 48), glassMat({ opacity: 0.35 })); r.rotation.y = Math.PI / 2; r.position.set(q * L / 2, s.y0, 0); s.objs.add(r); });
      if (p.mode === 'closed') { const cap = cyl(0.44, 0.44, 0.08, solid(0x6b4a3a), 40); cap.rotation.z = Math.PI / 2; cap.position.set(-L / 2 - 0.04, s.y0, 0); s.objs.add(cap); }
      [-L / 2 + 0.3, L / 2 - 0.3].forEach(x => { const st = cyl(0.03, 0.03, s.y0 - 0.42, solid(0x59606a), 8); st.position.set(x, (s.y0 - 0.42) / 2 + 0.12, 0); s.objs.add(st); });
      // 空気の粒（たてに並べる）
      const cols = 46, rows = 7;
      s.dots = new THREE.InstancedMesh(new THREE.SphereGeometry(0.03, 8, 6), solid(0x2f6fd0), cols * rows); s.dots.userData.noFit = true; s.objs.add(s.dots);
      s.dpos = []; for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) s.dpos.push([-L / 2 + 0.06 + i / (cols - 1) * (L - 0.12), (j - (rows - 1) / 2) * 0.1 + (i % 2 ? 0.05 : 0) * 0]);
      s.dummy = new THREE.Object3D();
      s.env = makeLine(new Array(121).fill(0).map(() => V3()), 0xb8502c, 0.06, 0.9); s.env.position.z = 0.5; s.objs.add(s.env);
    }
    s.inc = makeLine(new Array(121).fill(0).map(() => V3()), 0x2f6fd0, 0, 0.7); s.ref = makeLine(new Array(121).fill(0).map(() => V3()), 0xc8452f, 0, 0.7);
    s.inc.position.z = s.ref.position.z = 0.02; g.add(s.inc, s.ref);
    s.marks = [];
    const m = p.mode === 'closed' ? 2 * p.n - 1 : p.n;
    s.k = p.mode === 'closed' ? m * Math.PI / (2 * L) : m * Math.PI / L;
    s.m = m;
    // 節と腹の目印
    const addMark = (x, isNode) => { const L2 = addLabel(isNode ? '節' : '腹', () => V3(x, s.y0 + 0.62, 0), isNode ? 'k' : 'f'); s.marks.push(L2); };
    const amp = x => p.mode === 'string' ? Math.sin(s.k * (x + L / 2)) : p.mode === 'open' ? Math.cos(s.k * (x + L / 2)) : Math.sin(s.k * (x + L / 2));
    // 弦は変位の節、気柱は空気の変位の節（開管・閉管とも）
    for (let i = 0; i <= 600; i++) { const x = -L / 2 + i / 600 * L; const a = Math.abs(amp(x)), aL = Math.abs(amp(x - L / 600)), aR = Math.abs(amp(x + L / 600)); if (a < 0.02 && a <= aL && a <= aR) addMark(x, true); if (a > 0.995 && a >= aL && a >= aR) addMark(x, false); }
    s.amp = amp;
  },
  step() {},
  draw(s) {
    const p = s.p, L = s.L, w = 2 * Math.PI * 0.6 * s.m * (p.mode === 'closed' ? 0.5 : 1) * Math.min(1, 3 / s.m) ** 0.5, A = 0.35;
    const ct = Math.cos(w * s.t);
    if (p.mode === 'string') {
      const pos = s.geo.attributes.position.array, b = s.base;
      for (let i = 0; i < pos.length; i += 3) pos[i + 1] = b[i + 1] + A * s.amp(b[i]) * ct;
      s.geo.attributes.position.needsUpdate = true; s.geo.computeVertexNormals();
    } else {
      const d = s.dummy;
      s.dpos.forEach(([x, yy], i) => { d.position.set(x + 0.09 * s.amp(x) * ct, s.y0 + yy, 0); d.updateMatrix(); s.dots.setMatrixAt(i, d.matrix); });
      s.dots.instanceMatrix.needsUpdate = true;
      const ep = []; for (let i = 0; i <= 120; i++) { const x = -L / 2 + i / 120 * L; ep.push(V3(x, s.y0 + 0.36 * s.amp(x) * ct, 0)); }
      setLine(s.env, ep);
    }
    // 入射波と反射波（定常波 = 2つの進行波の和）
    const show = p.split;
    s.inc.visible = s.ref.visible = show;
    if (show) {
      const a = [], r = [], k = s.k, yb = p.mode === 'string' ? s.y0 : s.y0;
      const zz = p.mode === 'string' ? 0 : 0.5;
      for (let i = 0; i <= 120; i++) {
        const x = -L / 2 + i / 120 * L, u = x + L / 2;
        let y1, y2;
        if (p.mode === 'string' || p.mode === 'closed') { y1 = 0.5 * Math.sin(k * u - w * s.t); y2 = 0.5 * Math.sin(k * u + w * s.t); }
        else { y1 = 0.5 * Math.cos(k * u - w * s.t); y2 = 0.5 * Math.cos(k * u + w * s.t); }
        const sc = p.mode === 'string' ? A : 0.36;
        a.push(V3(x, yb + sc * y1, zz)); r.push(V3(x, yb + sc * y2, zz));
      }
      setLine(s.inc, a); setLine(s.ref, r);
    }
  },
  live(s) {
    const p = s.p, lam = p.mode === 'closed' ? 4 * p.Lr / s.m : 2 * p.Lr / s.m;
    const f = p.vs / lam;
    const nodes = s.marks.filter(m => m.el.textContent === '節').length, anti = s.marks.length - nodes;
    const o = { lam: fmt(lam, 3) + ' m', f: fmt(f, 0) + ' Hz', nd: nodes + ' 個', an: anti + ' 個', f1: fmt(p.mode === 'closed' ? p.vs / (4 * p.Lr) : p.vs / (2 * p.Lr), 0) + ' Hz' };
    const pts = [];
    for (let j = 1; j <= 8; j++) { const mm = p.mode === 'closed' ? 2 * j - 1 : j; pts.push([j, mm]); }
    o.graph = plot({ x: [0, 8.5], y: [0, 16], xl: 'n（何番目の固有振動か）', yl: '基本振動数の何倍か', series: [{ pts, c: C.muted, w: 1, end: false }], pt: pts.map(([a, b]) => ({ x: a, y: b, c: a === p.n ? C.warm : C.vel, r: a === p.n ? 5 : 3 })) });
    return o;
  },
  html(s) {
    return `<div class="ctl">${ui.goal(s)}${ui.seg(s, 'mode', 'ふるえるもの', [['string', '弦'], ['open', '開管'], ['closed', '閉管']])}
      ${ui.sliders(s, ['n', 'Lr', 'vs'])}
      ${ui.chk(s, [['split', '入射波（青）と反射波（赤）に分ける']])}
      ${ui.meter([['lam', '波長 λ'], ['f', '振動数 f'], ['f1', '基本振動数'], ['nd', '節の数'], ['an', '腹の数']])}
      ${ui.graph('固有振動数の並び方（閉管は奇数倍だけ）')}
      <p class="note">${s.p.mode === 'string' ? '弦の両はしは固定端なので「節」。' : s.p.mode === 'open' ? '開管の両はしは空気が自由に動けるので「腹」。点線は空気の変位を横向きに表したもの。' : '閉管の閉じたはしは空気が動けないので「節」、開いたはしは「腹」。'}</p></div>`;
  },
  goal: '<b>閉管</b>にして、n を 1, 2, 3 と変えよう。振動数は基本振動の何倍になっている？',
  goalMsg: '閉管では 1, 3, 5 …（奇数倍）の振動だけが起こる。',
  check(s) { return s.p.mode === 'closed' && s.p.n >= 3; },
  how: `<p class="txt">はしで反射した波と、もとの波が重なると、その場で大きくゆれるだけの波ができる。これが<b>定常波</b>（定在波）。まったくゆれない点が<b>節</b>、いちばん大きくゆれる点が<b>腹</b>。節と節の間は λ/2。</p>
    <div class="formula">弦（両はし固定）・開管：<var>L</var> = <var>n</var> · <var>λ</var>/2　→　<var>f<sub>n</sub></var> = <var>n</var> <var>V</var>/2<var>L</var><br>閉管：<var>L</var> = (2<var>n</var> − 1) · <var>λ</var>/4　→　<var>f</var> = (2<var>n</var> − 1) <var>V</var>/4<var>L</var><small>開管・閉管の開口端では、実際は少し外側に腹ができる（開口端補正）</small></div>
    <p class="txt">弦の波の速さは <var>v</var> = √(<var>S</var>/<var>ρ</var>)（S：張力、ρ：線密度）。弦を強く張るほど高い音、長くするほど低い音になる。</p>`,
  points: [['o', '節と節、腹と腹の間はどちらも λ/2'], ['o', '閉管の基本振動は、同じ長さの開管の半分の振動数（1オクターブ低い）'], ['x', '定常波は右や左に進んでいく、はまちがい（その場でゆれる）'], ['o', '気柱の「節」は空気の圧力（密度）の変化がいちばん大きい所']],
  exam: '気柱共鳴の実験（共鳴の位置の差 = λ/2、開口端補正）、弦の固有振動、うなりとの組み合わせがよく出る。',
  view(s) { return [[0, 0.9, 0], 4.0, [0, 0.3, 1]]; },
});

// ---------- ドップラー効果 ----------
sim({
  id: 'doppler', cat: '波', icon: 'ド', name: 'ドップラー効果',
  lead: '音源が近づくと高く、遠ざかると低く聞こえる。前では波長が縮む。',
  params: [
    { k: 'vs', label: '音源の速さ <var>v<sub>s</sub></var>', min: 0, max: 450, step: 5, v: 120, unit: 'm/s', d: 0, reset: true },
    { k: 'f0', label: '音源の振動数 <var>f</var>', min: 300, max: 1000, step: 10, v: 500, unit: 'Hz', d: 0 },
  ],
  p0: { sound: false, ear: 'front' },
  init(s) {
    const g = R.group;
    s.V = 3.4; s.k = s.V / 340; // 1 マス = 100 m、340 m/s → 3.4 マス/秒
    setFloor(true, 1, 0);
    s.car = new THREE.Group(); s.car.scale.setScalar(1.6); g.add(s.car);
    const body = roundBox(0.9, 0.38, 0.5, 0.08, solid(0xf2efe8, { shininess: 60 })); body.position.y = 0.3; s.car.add(body);
    const stripe = box(0.92, 0.07, 0.52, solid(0xc8452f)); stripe.position.y = 0.3; s.car.add(stripe);
    s.siren = ball(0.08, new THREE.MeshPhongMaterial({ color: 0xff3b30, emissive: 0xff3b30, emissiveIntensity: 0.6 })); s.siren.position.y = 0.55; s.car.add(s.siren);
    [-0.28, 0.28].forEach(x => [-0.26, 0.26].forEach(z => { const w = cyl(0.09, 0.09, 0.06, solid(0x2a2e33), 16); w.rotation.x = Math.PI / 2; w.position.set(x, 0.1, z); s.car.add(w); }));
    s.shC = contactShadow(1.3, 0.9, 0.5); s.car.add(s.shC);
    const ear = (x, name) => { const m = new THREE.Group(); const st = cyl(0.02, 0.02, 0.6, solid(0x59606a), 8); st.position.y = 0.3; m.add(st); const h = ball(0.1, solid(0x2c6352)); h.position.y = 0.65; m.add(h); m.position.set(x, 0, 0); g.add(m); m.add(contactShadow(0.5, 0.5, 0.5)); return m; };
    s.front = ear(9, '前'); s.back = ear(-9, '後ろ');
    s.lf = addLabel('', () => V3(9, 0.85, 0), 'k'); s.lb = addLabel('', () => V3(-9, 0.85, 0), 'k');
    s.rings = []; s.nextE = 0; s.x = -6; s.ringGeo = []; s.done = false;
    const circ = []; for (let i = 0; i <= 72; i++) { const a = i / 72 * Math.PI * 2; circ.push(V3(Math.cos(a), 0, Math.sin(a))); }
    s.circGeo = new THREE.BufferGeometry().setFromPoints(circ);
    s.cone = makeLine([V3(), V3(), V3()], 0xc8452f, 0, 0.9); g.add(s.cone);
  },
  step(s, dt) {
    const p = s.p, vs = p.vs * s.k;
    s.x += vs * dt;
    if (s.t >= s.nextE) {
      s.nextE += 0.25;
      const l = new THREE.LineLoop(s.circGeo, new THREE.LineBasicMaterial({ color: 0x2f6fd0, transparent: true, opacity: 0.8 }));
      l.position.set(s.x, 0.04, 0); l.userData.t0 = s.t; l.userData.noFit = true; l.userData.shared = true;
      R.group.add(l); s.rings.push(l);
    }
    for (let i = s.rings.length - 1; i >= 0; i--) { const r = s.rings[i], rr = s.V * (s.t - r.userData.t0); if (rr > 16) { R.group.remove(r); r.material.dispose(); s.rings.splice(i, 1); } }
    if (s.x > 7.5) return 'stop';
  },
  draw(s) {
    const p = s.p;
    s.car.position.x = s.x;
    s.rings.forEach(r => { const rr = Math.max(0.001, s.V * (s.t - r.userData.t0)); r.scale.set(rr, 1, rr); r.material.opacity = clamp(1 - rr / 16, 0.1, 0.85); });
    s.siren.material.emissiveIntensity = 0.3 + 0.5 * (Math.sin(s.t * 12) > 0 ? 1 : 0);
    // 衝撃波の円すい
    const M = p.vs / 340;
    s.cone.visible = M > 1 && s.t > 0.6;
    if (M > 1) { const L = s.V * Math.min(s.t, 4) * M, a = Math.asin(1 / M); setLine(s.cone, [V3(s.x - L * Math.cos(a), 0.05, L * Math.sin(a)), V3(s.x, 0.05, 0), V3(s.x - L * Math.cos(a), 0.05, -L * Math.sin(a))]); }
    const ff = dop(p.vs, p.f0, 1), fb = dop(p.vs, p.f0, -1);
    s.lf.set(ff ? `${fmt(ff, 0)} Hz` : '衝撃波'); s.lb.set(`${fmt(fb, 0)} Hz`);
    if (s.mem.osc) { const fr = p.ear === 'front' ? ff : fb; s.mem.osc.frequency.setTargetAtTime(fr || p.f0, s.mem.ac.currentTime, 0.05); s.mem.gain.gain.setTargetAtTime(state.running && !s.ended ? 0.08 : 0, s.mem.ac.currentTime, 0.05); }
  },
  live(s) {
    const p = s.p, ff = dop(p.vs, p.f0, 1), fb = dop(p.vs, p.f0, -1);
    const o = { ff: ff ? fmt(ff, 0) + ' Hz' : '（衝撃波）', fb: fmt(fb, 0) + ' Hz', lf: p.vs < 340 ? fmt((340 - p.vs) / p.f0, 3) + ' m' : '—', lb: fmt((340 + p.vs) / p.f0, 3) + ' m', M: fmt(p.vs / 340, 2) };
    const pts = [], pts2 = []; for (let v = 0; v <= 330; v += 5) { pts.push([v, dop(v, p.f0, 1)]); pts2.push([v, dop(v, p.f0, -1)]); }
    o.graph = plot({ x: [0, 340], y: [0, p.f0 * 4], xl: '音源の速さ [m/s]', yl: '聞こえる振動数 [Hz]', series: [{ pts, c: C.warm, end: false }, { pts: pts2, c: C.vel, end: false }], marks: [{ y: p.f0, label: 'もとの振動数' }], pt: p.vs < 340 ? [{ x: p.vs, y: ff, c: C.warm }, { x: p.vs, y: fb, c: C.vel }] : [] });
    return o;
  },
  html(s) {
    return `<div class="ctl">${ui.goal(s)}${ui.sliders(s, ['vs', 'f0'])}
      <div class="row"><button type="button" class="btn" data-act="sound" aria-pressed="${!!s.mem.osc}">${s.mem.osc ? '音を止める' : '音を出す ♪'}</button></div>
      ${s.mem.osc ? ui.seg(s, 'ear', '聞く場所', [['front', '前の人'], ['back', '後ろの人']]) : ''}
      ${ui.meter([['ff', '前で聞こえる振動数'], ['fb', '後ろで聞こえる振動数'], ['lf', '前の波長'], ['lb', '後ろの波長'], ['M', 'マッハ数 vs/V']])}
      ${ui.graph('音源の速さと聞こえる振動数', [['前', C.warm], ['後ろ', C.vel]])}
      <p class="note">音速 V = 340 m/s。地面の 1 マス = 100 m。音速をこえると、波面が重なって円すい形の衝撃波ができる。</p></div>`;
  },
  act(s, a) {
    if (a === 'sound') {
      if (s.mem.osc) { stopSound(s.mem); renderCard(); return; }
      try {
        const AC = window.AudioContext || window.webkitAudioContext; s.mem.ac = new AC();
        s.mem.osc = s.mem.ac.createOscillator(); s.mem.gain = s.mem.ac.createGain(); s.mem.gain.gain.value = 0; s.mem.osc.type = 'triangle';
        s.mem.osc.connect(s.mem.gain).connect(s.mem.ac.destination); s.mem.osc.start();
      } catch (e) { toast('この環境では音を出せない。', 'ng'); s.mem.osc = null; }
      renderCard();
    }
  },
  leave(s) { stopSound(s.mem); },
  goal: '音源を<b>音速（340 m/s）より速く</b>しよう。波面はどうなる？',
  goalMsg: '波面が重なり、円すい形の衝撃波（ソニックブーム）ができる。',
  check(s) { return s.p.vs > 345 && s.t > 1.5; },
  how: `<p class="txt">音源が動きながら音を出すと、進む向きの前では波面がつまり（波長が短い）、後ろでは間が広がる（波長が長い）。音の速さ <var>V</var> は変わらないので、前では振動数が大きく（高い音）、後ろでは小さく（低い音）聞こえる。</p>
    <div class="formula"><var>f'</var> = <var>f</var> × (<var>V</var> − <var>v<sub>o</sub></var>) / (<var>V</var> − <var>v<sub>s</sub></var>)<small>v<sub>s</sub>：音源の速度、v<sub>o</sub>：観測者の速度（どちらも「音源 → 観測者」の向きを正）</small>前の波長 <var>λ'</var> = (<var>V</var> − <var>v<sub>s</sub></var>) / <var>f</var></div>
    <p class="txt">救急車のサイレンが、通りすぎた瞬間に低くなるのはこのため。観測者が動く場合は、波長は変わらず、出会う波の数（振動数）が変わる。</p>`,
  points: [['o', '音源が動くと「波長」が変わる。観測者が動くと「出会う回数」が変わる'], ['o', '風があるときは、音速を V ± 風速にして考える'], ['x', '近づくと音が大きくなるから高く聞こえる、はまちがい（大きさと高さは別）'], ['o', '光でも起こる（遠ざかる星の光は赤い方へずれる＝赤方偏移）']],
  exam: '音源と観測者が両方動く場合、反射板で反射した音（2段階で考える）、うなりと組み合わせた問題がよく出る。',
  view() { return [[0, 0, 0], 10.5, [0, 1.3, 1]]; },
});
function dop(vs, f0, dir) { const V = 340; const d = V - dir * vs; return d <= 0 ? null : f0 * V / d; }
function stopSound(m) { if (m.osc) { try { m.osc.stop(); m.ac.close(); } catch (e) { /* 無視 */ } m.osc = null; } }

// ---------- 光の屈折と全反射 ----------
sim({
  id: 'refr', cat: '波', icon: '屈', name: '光の屈折と全反射',
  lead: '光は境界で曲がる。ガラスから空気へ出るとき、角度が大きいと全部はね返る。',
  params: [
    { k: 'th', label: '入射角 <var>i</var>', min: 0, max: 89, step: 0.5, v: 30, unit: '°', d: 1 },
  ],
  p0: { n: 1.5, dir: 'in' },
  autoplay: true,
  init(s) {
    const g = R.group, Rr = 2.2;
    s.Rr = Rr;
    // 分度器の台

    const tk = []; for (let a = 0; a < 360; a += 2) { const r2 = a % 10 === 0 ? 3.1 : 3.22; const c = Math.cos(a * DEG), sn = Math.sin(a * DEG); tk.push(V3(c * 3.32, 0.045, sn * 3.32), V3(c * r2, 0.045, sn * r2)); }

    g.add(makeLine([V3(0, 0.05, -3.3), V3(0, 0.05, 3.3)], COL.ink, 0.08, 0.6));
    g.add(makeLine([V3(-3.3, 0.05, 0), V3(3.3, 0.05, 0)], COL.ink, 0, 0.4));

    // 半円形ガラス（z ≦ 0 の側）
    const sh = new THREE.Shape(); sh.moveTo(-Rr, 0); sh.absarc(0, 0, Rr, Math.PI, 2 * Math.PI, false); sh.lineTo(-Rr, 0);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.5, bevelEnabled: false, curveSegments: 64 }); geo.rotateX(Math.PI / 2); geo.translate(0, 0.55, 0);

    const eg = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial({ color: 0x8ab8c8, transparent: true, opacity: 0.8 })); g.add(eg);

    const body = cyl(0.12, 0.12, 0.8, metal(0x2a2e33, 0.3), 24); body.rotation.x = Math.PI / 2; s.laser.add(body);

    const beam = c => { const m = cyl(0.03, 0.03, 1, new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 1, depthWrite: false }), 8); m.userData.noFit = true; g.add(m); const gl = cyl(0.09, 0.09, 1, new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.18, depthWrite: false }), 8); gl.userData.noFit = true; g.add(gl); return { m, gl }; };
    s.b1 = beam(0xff3b30); s.b2 = beam(0xff3b30); s.b3 = beam(0xff3b30);

  },
  step() {},
  draw(s) {
    const p = s.p, n = p.n, th = p.th * DEG, y = 0.3, L = 3.2;
    const setB = (b, a, c, k) => { const L2 = placeBetween(b.m, a, c); b.m.scale.y = L2; placeBetween(b.gl, a, c); b.gl.scale.y = L2; b.m.material.opacity = k; b.gl.material.opacity = 0.18 * k; b.m.visible = b.gl.visible = k > 0.01; };
    const O = V3(0, y, 0);

    const sI = p.dir === 'in' ? 1 : -1;

    s.laser.position.copy(src); s.laser.lookAt(O); s.laser.rotateY(Math.PI);
    setB(s.b1, src, O, 1);
    const n1 = p.dir === 'in' ? 1 : n, n2 = p.dir === 'in' ? n : 1;
    const sr = n1 / n2 * Math.sin(th);
    const refl = V3(Math.sin(th) * L, y, sI * Math.cos(th) * L);
    let R_ = 1, tr = null;
    if (sr < 1) {
      const t2 = Math.asin(sr), ci = Math.cos(th), ct = Math.cos(t2);
      const rs = ((n1 * ci - n2 * ct) / (n1 * ci + n2 * ct)) ** 2, rp = ((n1 * ct - n2 * ci) / (n1 * ct + n2 * ci)) ** 2;
      R_ = (rs + rp) / 2; tr = t2;
      setB(s.b3, O, V3(Math.sin(t2) * L, y, -sI * Math.cos(t2) * L), 1 - R_);
    } else setB(s.b3, O, O.clone().add(V3(0.001, 0, 0)), 0);
    setB(s.b2, O, refl, Math.max(R_, 0.06));
    s.dot.position.copy(O);
    s.R = R_; s.t2 = tr;
    s.pi.copy(src).lerp(O, 0.45).add(V3(0, 0.25, 0)); s.li.set(`入射角 ${fmt(p.th, 1)}°`);

    else { s.pr.copy(refl).lerp(O, 0.5).add(V3(0, 0.25, 0)); s.lr.set('全反射'); s.lr.el.className = 'lbl warn'; }
    if (tr !== null) s.lr.el.className = 'lbl f';
  },
  live(s) {

    const pts = []; for (let a = 0; a <= 90; a += 1) { const sr = n1 / n2 * Math.sin(a * DEG); if (sr <= 1) pts.push([a, Math.asin(sr) / DEG]); }
    o.graph = plot({ x: [0, 90], y: [0, 90], xl: '入射角 [°]', yl: '屈折角 [°]', series: [{ pts, c: C.warm, end: false }, { pts: [[0, 0], [90, 90]], c: C.muted, dash: true, w: 1 }], marks: crit ? [{ x: crit, c: C.vel, label: '臨界角' }] : [], pt: s.t2 ? [{ x: p.th, y: s.t2 / DEG, c: C.warm, r: 5 }] : [] });
    return o;
  },
  html(s) {
    return `<div class="ctl">${ui.goal(s)}${ui.seg(s, 'dir', '光の向き', [['in', '空気 → ガラス'], ['out', 'ガラス → 空気']])}
      ${ui.slider(s, 'th')}
      ${ui.seg(s, 'n', '物質（屈折率）', [[1.33, '水 1.33'], [1.5, 'ガラス 1.50'], [2.42, 'ダイヤ 2.42']])}
      ${ui.meter([['i', '入射角'], ['r', '屈折角'], ['ratio', 'sin i / sin r'], ['n12', '相対屈折率 n₁₂'], ['crit', '臨界角'], ['Rf', '反射する光の割合']])}
      ${ui.graph('入射角と屈折角')}
      <p class="note">半円形のガラスは、曲面に垂直に入る光が曲がらないので、平らな面での屈折だけを調べられる。</p></div>`;
  },
  goal: '<b>ガラス → 空気</b>にして、入射角を大きくしていこう。<b>全反射</b>が起こる角度は？',
  goalMsg: 'ガラス（n = 1.5）の臨界角は約 41.8°。光ファイバーはこれを利用している。',

  how: `<p class="txt">光は物質によって進む速さがちがう。速さの変わる境界で、光は進む向きを変える（<b>屈折</b>）。真空中の光の速さを、物質中の速さで割った値が<b>屈折率</b> <var>n</var>。</p>
    <div class="formula"><var>n</var><sub>1</sub> sin<var>i</var> = <var>n</var><sub>2</sub> sin<var>r</var>（屈折の法則）<br>sin<var>i</var> / sin<var>r</var> = <var>v</var><sub>1</sub>/<var>v</var><sub>2</sub> = <var>λ</var><sub>1</sub>/<var>λ</var><sub>2</sub> = <var>n</var><sub>2</sub>/<var>n</var><sub>1</sub><br>臨界角 sin<var>θ<sub>c</sub></var> = 1/<var>n</var>（物質 → 空気）</div>

    <p class="txt">境界では、屈折するときも一部の光が反射している。臨界角に近づくほど反射の割合が大きくなる。</p>`,
  points: [['o', '屈折しても振動数は変わらない。速さと波長が変わる'], ['o', '入射角と屈折角は、境界面ではなく「法線」からの角度'], ['x', '空気からガラスへ入るときも全反射する、はまちがい'], ['o', '水中から見ると、水面の外の景色は臨界角の円の中に見える']],
  exam: '屈折の法則の計算、臨界角、見かけの深さ（浅く見える）、光ファイバーの条件、プリズムの分散がよく出る。',

sim({

    s.F = [addLabel('F', () => V3(-s.p.f * (s.p.kind === 'convex' ? 1 : -1), ax - 0.15, 0), 'plain', -18), addLabel("F'", () => V3(s.p.f * (s.p.kind === 'convex' ? 1 : -1), ax - 0.15, 0), 'plain', -18)];
    s.fdots = [ball(0.05, solid(0x2a2e33)), ball(0.05, solid(0x2a2e33))]; s.fdots.forEach(d => g.add(d));
    // 物体（ろうそく風の矢印）
    const arrow = (color, op) => { const gg = new THREE.Group(); const m = new THREE.MeshPhongMaterial({ color, transparent: op < 1, opacity: op, depthWrite: op >= 1 }); const sh2 = cyl(0.05, 0.05, 1, m, 12); sh2.position.y = 0.5; gg.add(sh2); const hd = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 16), m); hd.position.y = 1.0; gg.add(hd); g.add(gg); return gg; };
    s.obj = arrow(0xd08a1e, 1); s.img = arrow(0xb8502c, 0.55);
    s.flame = ball(0.08, new THREE.MeshBasicMaterial({ color: 0xffc040 })); g.add(s.flame);
    s.screen = box(0.04, 2.6, 1.6, solid(0xf6f3ea, { shininess: 5 })); g.add(s.screen);
    s.rayG = new THREE.Group(); g.add(s.rayG);
    s.rays = [0, 1, 2].map(() => makeLine([V3(), V3(), V3()], 0xe0a020, 0, 0.95));
    s.ext = [0, 1, 2].map(() => makeLine([V3(), V3()], 0xe0a020, 0.1, 0.6));
    s.rays.forEach(r => s.rayG.add(r)); s.ext.forEach(r => s.rayG.add(r));

  },
  step() {},
  draw(s) {
    const p = s.p, ax = s.ax, f = p.kind === 'convex' ? p.f : -p.f, a = p.a, h = 1;
    const key = p.kind + p.f;

      while (s.lensG.children.length) { const o = s.lensG.children.pop(); o.geometry.dispose(); o.material.dispose(); }
      // 円形のレンズ：厚みの形を回転させてつくる（回転の軸を光軸に向ける）
      const H = 1.2, bulge = 0.5 / p.f, cv = p.kind === 'convex';
      const th = r => 0.03 + bulge * (cv ? 1 - (r / H) ** 2 : (r / H) ** 2);
      const lat = [];
      for (let i = 0; i <= 24; i++) { const r = H * i / 24; lat.push(V2(Math.max(r, 1e-3), -th(r))); }
      for (let i = 24; i >= 0; i--) { const r = H * i / 24; lat.push(V2(Math.max(r, 1e-3), th(r))); }
      const body = new THREE.Mesh(new THREE.LatheGeometry(lat, 64), glassMat({ opacity: 0.32, color: 0xcfe9f2 }));
      body.rotation.z = Math.PI / 2; body.renderOrder = 3; s.lensG.add(body);
      const rim = new THREE.Mesh(new THREE.TorusGeometry(H, 0.03, 8, 64), metal(0x3a4049, 0.3)); rim.rotation.y = Math.PI / 2; s.lensG.add(rim);
    }
    s.fdots[0].position.set(-Math.abs(f), ax, 0); s.fdots[1].position.set(Math.abs(f), ax, 0);
    s.obj.position.set(-a, ax, 0); s.flame.position.set(-a, ax + 1.25 + 0.03 * Math.sin(s.t * 9), 0);
    const b = Math.abs(a - f) < 1e-6 ? Infinity : a * f / (a - f); // 1/a + 1/b = 1/f（b < 0 は虚像）
    const m = -b / a; // 像の倍率（負＝倒立）
    s.b = b; s.m = m;
    const real = isFinite(b) && b > 0;
    s.img.visible = isFinite(b) && Math.abs(b) < 30;
    if (s.img.visible) { s.img.position.set(b, ax, 0); s.img.scale.set(1, m, 1); s.img.children.forEach(c => { c.material.opacity = real ? 0.75 : 0.32; }); }
    s.screen.visible = real && b < 10.3; s.screen.position.set(b + 0.15, ax, 0);
    s.imgTop.set(isFinite(b) ? b : 10, ax + (isFinite(m) ? m : 1) * h + (m < 0 ? -0.1 : 0.35), 0);
    s.lImg.set(!isFinite(b) ? '像はできない' : real ? '実像（倒立）' : '虚像（正立）');
    s.lImg.el.hidden = !s.img.visible && isFinite(b);
    // 3本の光線
    s.rayG.visible = p.rays;
    const P = V3(-a, ax + h, 0), far = 11;
    const I = isFinite(b) ? V3(b, ax + m * h, 0) : null;
    const lineThrough = (A, B, x) => { const t = (x - A.x) / (B.x - A.x); return V3(x, A.y + (B.y - A.y) * t, 0); };
    // ① 光軸に平行 → 焦点 F' を通る（凹レンズは F から出たように広がる）

  },

  how: `<p class="txt">凸レンズは、光軸に平行な光を<b>焦点</b> F' に集める。物体の1点から出た光は、レンズを通ったあと再び1点に集まり、<b>実像</b>ができる。作図には次の3本の光線を使う。</p>
    <ul class="pts"><li><b>1</b><span>光軸に平行に入った光 → 後ろの焦点 F' を通る</span></li><li><b>2</b><span>レンズの中心を通る光 → そのまま直進</span></li><li><b>3</b><span>前の焦点 F を通った光 → 光軸に平行に出る</span></li></ul>

// ---------- 電場と電位 ----------
sim({
  id: 'efield', cat: '電磁気', icon: '電', name: '電場と電位',
  lead: '電荷のまわりの電位を「高さ」で表すと、正の電荷は山、負の電荷は谷。電気力線は坂を下る向き。',
  params: [
    { k: 'q1', label: '電荷 <var>Q</var><sub>1</sub>', min: -3, max: 3, step: 1, v: 2, d: 0, fmt: v => (v > 0 ? '+' : '') + v, reset: true },
    { k: 'q2', label: '電荷 <var>Q</var><sub>2</sub>', min: -3, max: 3, step: 1, v: -2, d: 0, fmt: v => (v > 0 ? '+' : '') + v, reset: true },
    { k: 'd', label: '電荷の間 <var>d</var>', min: 1, max: 5, step: 0.1, v: 3, unit: 'm', reset: true },
  ],
  p0: { surf: true, lines: true },
  init(s) {
    const p = s.p, g = R.group, S = 10, N = 120;
    s.Q = [[-p.d / 2, p.q1], [p.d / 2, p.q2]].filter(q => q[1] !== 0);
    s.pot = (x, z) => { let v = 0; s.Q.forEach(([qx, q]) => { v += q / Math.sqrt((x - qx) ** 2 + z * z + 0.12); }); return v; };
    s.E = (x, z) => { let ex = 0, ez = 0; s.Q.forEach(([qx, q]) => { const dx = x - qx, r2 = dx * dx + z * z + 0.12, r3 = r2 * Math.sqrt(r2); ex += q * dx / r3; ez += q * z / r3; }); return [ex, ez]; };
    const H = (x, z) => clamp(s.pot(x, z) * 0.45, -3.2, 3.2);
    s.H = H;
    const geo = new THREE.PlaneGeometry(S, S, N, N); geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position.array, cols = new Float32Array(pos.length);
    const cP = new THREE.Color(0xc8452f), cN = new THREE.Color(0x2f6fd0), c0 = new THREE.Color(0xeee8da), tmp = new THREE.Color();
    for (let i = 0; i < pos.length; i += 3) {
      const h = H(pos[i], pos[i + 2]); pos[i + 1] = h;
      const t = clamp(Math.abs(h) / 2.2, 0, 1), band = (Math.abs(h * 4) % 1) < 0.08 ? 0.75 : 1;
      tmp.copy(c0).lerp(h > 0 ? cP : cN, t).multiplyScalar(band);
      cols[i] = tmp.r; cols[i + 1] = tmp.g; cols[i + 2] = tmp.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3)); geo.computeVertexNormals();
    s.surf = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ vertexColors: true, shininess: 30, side: THREE.DoubleSide, transparent: true, opacity: 0.92 }));
    s.surf.position.y = 3.4; g.add(s.surf);
    const flat = new THREE.Mesh(new THREE.PlaneGeometry(S, S), new THREE.MeshPhongMaterial({ color: 0xf4f0e6, shininess: 10 })); flat.rotation.x = -Math.PI / 2; flat.position.y = 0.01; g.add(flat);
    // 電荷
    s.Q.forEach(([qx, q]) => {
      const m = ball(0.2 + Math.abs(q) * 0.04, solid(q > 0 ? 0xc8452f : 0x2f6fd0, { shininess: 90 })); m.position.set(qx, 0.25, 0); g.add(m);
      const t = textSprite(q > 0 ? '+' : '−', 0.5, '#ffffff', 'bold 60px "IBM Plex Mono", monospace'); t.position.set(qx, 0.26, 0.0); t.scale.set(0.6, 0.6, 1); t.material.depthTest = false; g.add(t);
      g.add(contactShadow(0.9, 0.9, 0.5)).position.x = qx;
      addLabel(`${q > 0 ? '+' : '−'}${Math.abs(q)}Q`, () => V3(qx, 0.55, 0), q > 0 ? 'f' : 'v');
    });
    // 電気力線（正の電荷から出る。正がなければ無限遠から負へ）
    s.lineG = new THREE.Group(); g.add(s.lineG);
    const srcs = s.Q.filter(q => q[1] > 0), sinks = s.Q.filter(q => q[1] < 0);
    const start = srcs.length ? srcs : sinks, sg = srcs.length ? 1 : -1;
    start.forEach(([qx, q]) => {
      const nl = 6 * Math.abs(q);
      for (let j = 0; j < nl; j++) {
        const a = (j + 0.5) / nl * Math.PI * 2;
        let x = qx + Math.cos(a) * 0.25, z = Math.sin(a) * 0.25;
        const flatPts = [V3(x, 0.03, z)], up = [V3(x, 3.4 + H(x, z) + 0.04, z)];
        for (let k = 0; k < 900; k++) {
          const [ex, ez] = s.E(x, z), m = Math.hypot(ex, ez);
          if (m < 1e-6) break;
          x += sg * ex / m * 0.03; z += sg * ez / m * 0.03;
          if (Math.abs(x) > S / 2 || Math.abs(z) > S / 2) break;
          if (s.Q.some(([qx2, q2]) => q2 * sg < 0 && Math.hypot(x - qx2, z) < 0.22)) { flatPts.push(V3(x, 0.03, z)); up.push(V3(x, 3.4 + H(x, z) + 0.04, z)); break; }
          if (k % 2 === 0) { flatPts.push(V3(x, 0.03, z)); up.push(V3(x, 3.4 + H(x, z) + 0.04, z)); }
        }
        s.lineG.add(makeLine(flatPts, 0x2a2e33, 0, 0.75));
        const ul = makeLine(up, 0x2a2e33, 0, 0.45); ul.userData.up = true; s.lineG.add(ul);
        // 向きの矢じり
        const mid = flatPts[Math.min(flatPts.length - 1, 14)], nx = flatPts[Math.min(flatPts.length - 1, 15)];
        if (mid && nx && mid !== nx) { const c = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.18, 10), solid(0x2a2e33)); const dir = nx.clone().sub(mid).normalize(); c.position.copy(mid); c.quaternion.setFromUnitVectors(_up, sg > 0 ? dir : dir.negate()); s.lineG.add(c); }
      }
    });
    // 試験電荷
    s.tq = ball(0.12, solid(0xe0a020, { emissive: 0xe0a020, emissiveIntensity: 0.3 })); s.tq.visible = false; g.add(s.tq);
    s.tq2 = ball(0.12, solid(0xe0a020, { emissive: 0xe0a020, emissiveIntensity: 0.3 })); s.tq2.visible = false; g.add(s.tq2);
    s.tTrail = makeTrail(0xe0a020, 2000); g.add(s.tTrail.line);
    s.aE = makeArrow(0xe0a020, 0.03); g.add(s.aE.g);
    s.probe = null;
  },
  step(s, dt) {
    if (!s.probe) return;
    const [ex, ez] = s.E(s.probe.x, s.probe.z), m = Math.hypot(ex, ez);
    const sp = Math.min(m * 1.2, 3);
    if (m > 1e-6) { s.probe.x += ex / m * sp * dt; s.probe.z += ez / m * sp * dt; }
    if (Math.abs(s.probe.x) > 4.9 || Math.abs(s.probe.z) > 4.9 || s.Q.some(([qx, q]) => q < 0 && Math.hypot(s.probe.x - qx, s.probe.z) < 0.25)) { s.probe = null; }
  },
  draw(s) {
    const p = s.p;
    s.surf.visible = p.surf; s.lineG.visible = p.lines;
    s.lineG.children.forEach(c => { if (c.userData.up) c.visible = p.surf; });
    const on = !!s.probe;
    s.tq.visible = s.tq2.visible = on;
    if (on) {
      s.tq.position.set(s.probe.x, 0.14, s.probe.z); s.tq2.position.set(s.probe.x, 3.4 + s.H(s.probe.x, s.probe.z) + 0.12, s.probe.z); s.tq2.visible = p.surf;
      if (state.running) s.tTrail.push(s.tq.position);
      const [ex, ez] = s.E(s.probe.x, s.probe.z); s.aE.set(s.tq.position, V3(ex, 0, ez), 0.5);
    } else s.aE.g.visible = false;
  },
  live(s) {
    const pr = s.probe || { x: 0, z: 0 };
    const [ex, ez] = s.E(pr.x, pr.z);
    const o = { V: fmt(s.pot(pr.x, pr.z), 2), E: fmt(Math.hypot(ex, ez), 2), at: s.probe ? '試験電荷の場所' : 'まん中の点' };
    const pts = []; for (let i = 0; i <= 200; i++) { const x = -5 + i / 200 * 10; pts.push([x, clamp(s.pot(x, 0), -8, 8)]); }
    o.graph = plot({ x: [-5, 5], y: [-8, 8], xl: 'x [m]', yl: '電位 V（2つの電荷を結ぶ線の上）', series: [{ pts, c: C.warm, end: false }] });
    return o;
  },
  html(s) {
    return `<div class="ctl">${ui.goal(s)}${ui.sliders(s, ['q1', 'q2', 'd'])}
      <div class="row">${ui.btn('probe', '＋の試験電荷を置く', true)}<button type="button" class="btn" data-preset="dip">電気双極子</button><button type="button" class="btn" data-preset="same">同じ符号</button></div>
      ${ui.chk(s, [['surf', '電位を高さで表す'], ['lines', '電気力線']])}
      ${ui.meter([['at', '測る場所'], ['V', '電位（相対）'], ['E', '電場の強さ（相対）']])}
      ${ui.graph('電位のグラフ（正の電荷で山、負で谷）')}
      <p class="note">下の床に電気力線、上の曲面に電位をかいている。試験電荷は電場の向き（坂を下る向き）に動く。</p></div>`;
  },
  act(s, a, el) {
    if (a === 'probe') {
      const pos = s.Q.filter(q => q[1] > 0);
      const base = pos.length ? pos[Math.floor(Math.random() * pos.length)][0] : -4;
      const ang = Math.random() * Math.PI * 2;
      s.probe = pos.length ? { x: base + Math.cos(ang) * 0.4, z: Math.sin(ang) * 0.4 } : { x: -4.5, z: (Math.random() - 0.5) * 6 };
      s.tTrail.clear(); if (!state.running) { state.running = true; updatePlay(); }

    }
    if (el.dataset.preset === 'dip') { s.p.q1 = 2; s.p.q2 = -2; }
    if (el.dataset.preset === 'same') { s.p.q1 = 2; s.p.q2 = 2; }
    restart();
  },
  goal: '<b>同じ符号</b>の2つの電荷にしよう。まん中の点の電場はどうなっている？',
  goalMsg: '同じ大きさ・同じ符号だと、まん中で電場が打ち消し合って 0 になる。',
  check(s) { return s.p.q1 === s.p.q2 && s.p.q1 !== 0; },
  how: `<p class="txt">電荷のまわりには<b>電場</b>（電界）ができ、そこに置いた電荷は力を受ける。電場の向きは、＋1 C の電荷が受ける力の向き。電場のようすを表す線が<b>電気力線</b>で、正の電荷から出て負の電荷に入る。</p>
    <div class="formula">クーロンの法則 <var>F</var> = <var>k</var> <var>q</var><sub>1</sub><var>q</var><sub>2</sub>/<var>r</var><sup>2</sup><br>点電荷の電場 <var>E</var> = <var>kQ</var>/<var>r</var><sup>2</sup>　電位 <var>V</var> = <var>kQ</var>/<var>r</var><br>一様な電場 <var>V</var> = <var>Ed</var><small>k = 9.0×10⁹ N·m²/C²</small></div>
    <p class="txt"><b>電位</b>は「電気の高さ」。正の電荷は電位の高い所から低い所へ、ボールが坂を転がるように動く。電位の等しい所をつないだ線（等電位線）と電気力線は、いつも垂直に交わる。曲面の濃い帯が等電位線。</p>`,
  points: [['o', '電気力線どうしは交わらない。密な所ほど電場が強い'], ['o', '電場はベクトル、電位はスカラー（たし算のしかたがちがう）'], ['x', '電場が 0 の点では電位も 0、はまちがい'], ['o', '電荷 q を電位差 V だけ動かす仕事は W = qV']],
  exam: '2つの点電荷がつくる電場の合成（ベクトル）、電位の和、電場が 0 になる点、一様な電場中の荷電粒子の運動がよく出る。',
  view() { return [[0, 1.8, 0], 5.6, [0.15, 0.75, 1]]; },
});

// ---------- 磁場中の荷電粒子 ----------
sim({
  id: 'lorentz', cat: '電磁気', icon: '磁', name: '磁場中の荷電粒子（ローレンツ力）',
  lead: '磁場の中を動く電荷は、速度に垂直な力を受けて円をえがく。',
  params: [
    { k: 'B', label: '磁束密度 <var>B</var>', min: 0.5, max: 2, step: 0.05, v: 1, unit: 'T', reset: true },
    { k: 'v', label: '速さ <var>v</var>', min: 0.5, max: 3, step: 0.1, v: 1.5, unit: '', reset: true, fmt: v => fmt(v, 1) },
    { k: 'al', label: '磁場との角 <var>α</var>', min: 10, max: 90, step: 1, v: 90, unit: '°', reset: true },
    { k: 'm', label: '質量 <var>m</var>', min: 0.5, max: 3, step: 0.1, v: 1, unit: '', reset: true, fmt: v => fmt(v, 1) },
  ],
  p0: { q: 1, vec: true },
  legend: [['v', '速度 v'], ['f', 'ローレンツ力 F']],
  h: 1 / 480,
  init(s) {
    const p = s.p, g = R.group;
    R.controls.maxPolarAngle = Math.PI * 0.95;
    // 磁場（上向きの矢印の林）
    const bm = new THREE.MeshPhongMaterial({ color: 0x8a9aa8, transparent: true, opacity: 0.45, depthWrite: false });
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
      const r = cyl(0.012, 0.012, 5.6, bm, 6); r.position.set(i * 1.1, 2.9, j * 1.1); r.userData.noFit = true; g.add(r);
      const c = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 10), bm); c.position.set(i * 1.1, 5.8, j * 1.1); c.userData.noFit = true; g.add(c);
    }
    addLabel('磁場 B（上向き）', () => V3(2.2, 6.0, 2.2), 'plain');
    // 磁石の極板（上が S、下が N のイメージ）
    const pole = (y, c, t) => { const m = cyl(2.8, 2.8, 0.12, solid(c, { shininess: 40 }), 64); m.position.y = y; g.add(m); const sp = textSprite(t, 0.5, '#ffffff', 'bold 52px "Shippori Mincho B1", serif'); sp.position.set(-2.4, y, 2.4); sp.scale.set(0.5, 0.5, 1); g.add(sp); };
    pole(0.06, 0xc8452f, 'N'); pole(6.1, 0x2f6fd0, 'S');
    s.pt = ball(0.11, solid(p.q > 0 ? 0xc8452f : 0x2f6fd0, { emissive: p.q > 0 ? 0xc8452f : 0x2f6fd0, emissiveIntensity: 0.25 })); g.add(s.pt);
    s.sg = textSprite(p.q > 0 ? '+' : '−', 0.3, '#ffffff', 'bold 60px "IBM Plex Mono", monospace'); s.sg.scale.set(0.24, 0.24, 1); s.sg.material.depthTest = false; g.add(s.sg);
    s.trail = makeTrail(p.q > 0 ? 0xc8452f : 0x2f6fd0, 6000); g.add(s.trail.line);
    s.av = makeArrow(COL.vel, 0.025); s.af = makeArrow(COL.force, 0.025); g.add(s.av.g, s.af.g);
    const a = p.al * DEG;
    s.pos = V3(0, 0.9, 0); s.vel = V3(p.v * Math.sin(a), p.v * Math.cos(a), 0);
    // 円の中心が原点の真上に来るように始める
    const rr = p.m * p.v * Math.sin(a) / (Math.abs(p.q) * p.B);
    s.pos.z = -rr * Math.sign(p.q);
    s.r = rr; s.rec = recorder(0.02);
  },
  step(s, dt) {
    const p = s.p, B = V3(0, p.B, 0), k = p.q / p.m;
    // ボリス法（速さを変えない）
    const t = B.clone().multiplyScalar(k * dt / 2), sv = t.clone().multiplyScalar(2 / (1 + t.lengthSq()));
    const vp = s.vel.clone().add(s.vel.clone().cross(t));
    s.vel.add(vp.cross(sv));
    s.pos.addScaledVector(s.vel, dt);
    s.rec.add(s.t, s.vel.length(), s.vel.x);
    if (s.pos.y > 5.9 || s.t > 20) return 'stop';
  },
  draw(s) {
    const p = s.p;
    s.pt.position.copy(s.pos); s.sg.position.copy(s.pos);
    if (state.running) s.trail.push(s.pos);
    const F = s.vel.clone().cross(V3(0, p.B, 0)).multiplyScalar(p.q);
    s.av.set(s.pos, s.vel, 0.45); s.af.set(s.pos, F, 0.45);
    s.av.g.visible = s.av.g.visible && p.vec; s.af.g.visible = s.af.g.visible && p.vec;
  },
  live(s) {

    const t1 = Math.max(s.t, 2 * T), t0 = Math.max(0, t1 - 2 * T);

    return o;
  },
  html(s) {
    return `<div class="ctl">${ui.goal(s)}${ui.seg(s, 'q', '粒子', [[1, '正の電荷（陽子など）'], [-1, '負の電荷（電子など）']])}
      ${ui.sliders(s, ['B', 'v', 'al', 'm'])}
      ${ui.chk(s, [['vec', '速度と力の矢印']])}
      ${ui.meter([['r', '半径 r = mv⊥/qB'], ['T', '周期 T = 2πm/qB'], ['sp', '速さ（変わらない）'], ['pitch', 'らせんの1巻きで進む'], ['dir', '回る向き']])}
      ${ui.graph('速さ（朱）と速度の x 成分（青）', [['速さ', C.warm], ['vx', C.vel]])}</div>`;
  },

  goal: '磁場との角 <b>α を 90° より小さく</b>しよう。粒子はどんな形の道を進む？',
  goalMsg: '磁場に平行な成分はそのまま、垂直な成分で円運動 → らせん運動。',
  check(s) { return s.p.al < 80 && s.t > 3; },
  how: `<p class="txt">磁場の中を動く電荷は、<b>ローレンツ力</b>を受ける。力の向きは速度にも磁場にも垂直（フレミングの左手の法則：電流の向き＝正の電荷の動く向き）。</p>
    <div class="formula"><var>F</var> = <var>qvB</var>（<var>v</var> ⊥ <var>B</var> のとき）<br>円運動：<var>m</var><var>v</var><sup>2</sup>/<var>r</var> = <var>qvB</var>　→　<var>r</var> = <var>mv</var>/<var>qB</var><br>周期 <var>T</var> = 2π<var>m</var>/<var>qB</var><small>周期は速さによらない（サイクロトロンの原理）</small></div>
    <p class="txt">ローレンツ力はいつも速度に垂直なので、<b>仕事をしない</b>。そのため速さは変わらず、向きだけが変わる。グラフの速さが一定なのはこのため。</p>
    <p class="txt">速度が磁場と斜めのときは、磁場に平行な成分は力を受けないのでそのまま進み、垂直な成分で円運動する。合わせると<b>らせん</b>になる。オーロラは、宇宙から来た荷電粒子が地球の磁場にそってらせん運動して起こる。</p>`,
  points: [['o', '正と負の電荷では、回る向きが逆'], ['o', '速い粒子ほど大きな円をえがくが、周期は同じ'], ['x', 'ローレンツ力で粒子が加速される、はまちがい（速さは一定）'], ['o', '電流が磁場から受ける力 F = IBL は、ローレンツ力の集まり']],
  exam: '円運動の半径と周期、質量分析器、速度選別器（電場と磁場をかけて直進する条件 v = E/B）、ホール効果がよく出る。',
  view() { return [[0, 3, 0], 5.6, [0.6, 0.35, 1]]; },
});

// ---------- 電磁誘導 ----------
sim({
  id: 'induct', cat: '電磁気', icon: '誘', name: '電磁誘導',
  lead: 'コイルを通る磁束が変わると電流が流れる。向きは変化をさまたげる向き（レンツの法則）。',
  params: [
    { k: 'sp', label: '動かす速さ', min: 0.2, max: 3, step: 0.1, v: 1, unit: '倍', d: 1 },
    { k: 'N', label: '巻き数 <var>N</var>', min: 5, max: 30, step: 1, v: 15, unit: '回', d: 0, reset: true },
    { k: 'x', label: '磁石の位置', min: -4, max: 1.5, step: 0.01, v: -3, unit: '', fmt: v => fmt(v, 2) },
  ],
  p0: { auto: true, pole: 'N' },
  h: 1 / 480,
  init(s) {
    const p = s.p, g = R.group, cl = 1.6, cr = 0.55;
    s.cl = cl; s.cr = cr; s.cy = 0.9;

    const fc = document.createElement('canvas'); fc.width = 256; fc.height = 160; const fx = fc.getContext('2d');
    fx.fillStyle = '#f6f2e6'; fx.fillRect(0, 0, 256, 160); fx.strokeStyle = '#2a2e33'; fx.fillStyle = '#2a2e33'; fx.lineWidth = 2; fx.font = 'bold 20px "IBM Plex Mono", monospace'; fx.textAlign = 'center';
    for (let i = -10; i <= 10; i++) { const a = (-90 + i * 5) * DEG; const r2 = i % 5 === 0 ? 100 : 110; fx.beginPath(); fx.moveTo(128 + Math.cos(a) * 120, 150 + Math.sin(a) * 120); fx.lineTo(128 + Math.cos(a) * r2, 150 + Math.sin(a) * r2); fx.stroke(); if (i % 5 === 0) fx.fillText(String(Math.abs(i / 5) * 5), 128 + Math.cos(a) * 82, 156 + Math.sin(a) * 82); }
    fx.fillText('G', 128, 130);
    const face = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 0.78), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(fc) })); face.position.set(0, 0.6, 0.26); s.gal.add(face);
    s.needle = new THREE.Group(); s.needle.position.set(0, 0.6 - 0.78 / 2 + 0.06, 0.27); s.gal.add(s.needle);

    // 導線

    [w1, w2].forEach(c => g.add(new THREE.Mesh(new THREE.TubeGeometry(c, 40, 0.02, 6, false), solid(0xc8452f))));
    // 棒磁石

    s.lPole = addLabel('', () => V3(-cl / 2 - 0.1, s.cy + cr + 0.35, 0), 'f');

  },
  // 磁石（双極子）が、コイルの各巻きを通す磁束の合計
  linkage(s, xm) {
    const p = s.p, a = s.cr, sgn = p.pole === 'N' ? 1 : -1;
    let L = 0;
    for (let i = 0; i < p.N; i++) {
      const xc = -s.cl / 2 + (i + 0.5) / p.N * s.cl;
      // 磁石の両極（N: +、S: −）を磁荷とみなして、ループを通る磁束を求める
      [[xm + sgn * s.mL / 2, 1], [xm - sgn * s.mL / 2, -1]].forEach(([xq, q]) => { const z = xc - xq; L += q * 0.5 * (1 - z / Math.sqrt(z * z + a * a)) * Math.sign(1); });
    }
    return L;
  },
  step(s, dt) {
    const p = s.p;
    if (p.auto) { s.phase += dt * p.sp * 1.2; s.xm = -1.0 - 2.2 * Math.cos(s.phase); }
    else s.xm += clamp(p.x - s.xm, -6 * dt, 6 * dt);
    const L = s.def.linkage(s, s.xm);
    if (s.flux !== null) { const e = -(L - s.flux) / dt; s.emf += (e - s.emf) * Math.min(1, dt * 25); }
    s.flux = L;
    s.emfMax = Math.max(s.emfMax * (1 - dt * 0.3), Math.abs(s.emf));
    s.rec.add(s.t, L, s.emf);
  },
  draw(s) {
    const p = s.p, I = s.emf * 0.03;
    s.mag.position.x = s.xm; s.mag.rotation.y = p.pole === 'N' ? 0 : Math.PI;
    s.needle.rotation.z = -clamp(I * 0.9, -0.85, 0.85);
    // 電流の向き：コイルの巻きにそって粒が流れる

    // 誘導電流がつくる磁極（磁石に近い左はし）

  live(s) {

// ---------- 直流回路 ----------
sim({
  id: 'circuit', cat: '電磁気', icon: '回', name: '直流回路（オームの法則）',
  lead: '直列では電流が同じ、並列では電圧が同じ。豆電球の明るさは消費電力で決まる。',
  params: [

  p0: { mode: 'series', flow: 'current' },

  init(s) {
