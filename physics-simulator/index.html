    // 経路（電流の向き：電池の＋極から）
    if (p.mode === 'series') {
      s.paths = [{ br: 'I', pts: [P(-W, -0.4), P(-W, -D), P(0, -D), P(W, -D), P(W, 0), P(W, D), P(-W, D), P(-W, 0.4)] }];
      s.bulbs = [{ k: 'R1', at: P(0, -D), rot: 0 }, { k: 'R2', at: P(W, 0), rot: Math.PI / 2 }];
    } else {
      s.paths = [
        { br: 'I', pts: [P(-W, -0.4), P(-W, -D), P(-0.3, -D)] },
        { br: 'I1', pts: [P(-0.3, -D), P(W, -D), P(W, 0), P(W, D), P(-0.3, D)] },
        { br: 'I2', pts: [P(-0.3, -D), P(-0.3, 0), P(-0.3, D)] },
        { br: 'I', pts: [P(-0.3, D), P(-W, D), P(-W, 0.4)] },
      ];
      s.bulbs = [{ k: 'R1', at: P(W, 0), rot: Math.PI / 2 }, { k: 'R2', at: P(-0.3, 0), rot: Math.PI / 2 }];
    }
    const cu = metal(0xc87533, 0.4);
    s.paths.forEach(ph => { for (let i = 0; i < ph.pts.length - 1; i++) g.add(rod(ph.pts[i], ph.pts[i + 1], 0.025, cu)); ph.pts.forEach(q => { const j = ball(0.04, cu, 10); j.position.copy(q); g.add(j); }); ph.len = 0; ph.cum = [0]; for (let i = 1; i < ph.pts.length; i++) { ph.len += ph.pts[i].distanceTo(ph.pts[i - 1]); ph.cum.push(ph.len); } });
    // 電池
    const bat = new THREE.Group(); bat.position.set(-W, y + 0.2, 0); g.add(bat);
    const bb = cyl(0.2, 0.2, 0.8, solid(0x2a2e33, { shininess: 60 }), 32); bb.rotation.x = Math.PI / 2; bat.add(bb);
    const bt = cyl(0.205, 0.205, 0.3, solid(0xc8a040, { shininess: 80 }), 32); bt.rotation.x = Math.PI / 2; bt.position.z = -0.25; bat.add(bt);
    const nub = cyl(0.07, 0.07, 0.06, metal(0xd0d4d8), 16); nub.rotation.x = Math.PI / 2; nub.position.z = -0.43; bat.add(nub);
    addLabel('＋', () => V3(-W, y + 0.5, -0.4), 'f'); addLabel('－', () => V3(-W, y + 0.5, 0.42), 'v');
    s.lBat = addLabel('', () => V3(-W - 0.15, y + 0.75, 0), 'plain');
    // 豆電球（明るさ ∝ 消費電力）
    s.bulbs.forEach(b => {
      const gg = new THREE.Group(); gg.position.copy(b.at); gg.rotation.y = b.rot; g.add(gg);
      const sock = cyl(0.17, 0.17, 0.18, metal(0xb8bcc2, 0.5), 24); sock.position.y = 0.1; gg.add(sock);
      const glass = ball(0.28, glassMat({ opacity: 0.25, color: 0xfff6e0 }), 32); glass.position.y = 0.45; glass.renderOrder = 3; gg.add(glass);
      b.fil = ball(0.07, new THREE.MeshBasicMaterial({ color: 0xffc860, transparent: true, opacity: 0.2 }), 16); b.fil.position.y = 0.45; gg.add(b.fil);
      b.halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color: 0xffd080, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); b.halo.position.y = 0.45; b.halo.scale.set(1.4, 1.4, 1); b.halo.userData.keepMap = true; gg.add(b.halo);
      b.light = new THREE.PointLight(0xffc870, 0, 4); b.light.position.y = 0.5; gg.add(b.light);
      b.lb = addLabel('', () => b.at.clone().add(V3(0, 0.95, 0)), 'k');
    });
    s.dots = [];
    s.paths.forEach((ph, pi) => { const n = Math.round(ph.len / 0.22); for (let i = 0; i < n; i++) { const d = ball(0.035, new THREE.MeshBasicMaterial({ color: 0x2f6fd0 }), 8); d.userData = { ph: pi, u: i / n * ph.len }; g.add(d); s.dots.push(d); } });
  },
  calc(s) {
    const p = s.p;
    if (p.mode === 'series') { const R_ = p.R1 + p.R2, I = p.V / R_; return { R: R_, I, I1: I, I2: I, V1: I * p.R1, V2: I * p.R2 }; }
    const I1 = p.V / p.R1, I2 = p.V / p.R2; return { R: 1 / (1 / p.R1 + 1 / p.R2), I: I1 + I2, I1, I2, V1: p.V, V2: p.V };
  },
  step() {},
  draw(s) {
    const p = s.p, c = s.def.calc(s), dir = p.flow === 'current' ? 1 : -1;
    const at = (ph, u) => { let i = 1; while (i < ph.cum.length - 1 && ph.cum[i] < u) i++; const k = (u - ph.cum[i - 1]) / (ph.cum[i] - ph.cum[i - 1]); return ph.pts[i - 1].clone().lerp(ph.pts[i], k); };
    const dt = state.running ? 1 / 60 : 0;
    s.dots.forEach(d => {
      const ph = s.paths[d.userData.ph], I = c[ph.br];

      d.position.copy(at(ph, d.userData.u)); d.position.y += 0.03;
      d.material.color.set(p.flow === 'current' ? 0xd0502a : 0x2f6fd0);

    [['R1', 'V1', 'I1'], ['R2', 'V2', 'I2']].forEach(([k, vk, ik], i) => {
      const b = s.bulbs[i], P_ = c[vk] * c[ik], br = clamp(P_ / 4, 0, 1.6);
      b.fil.material.opacity = 0.25 + Math.min(br, 1) * 0.75; b.fil.material.color.setHSL(0.11, 1, 0.45 + Math.min(br, 1) * 0.4);
      b.halo.material.opacity = Math.min(br, 1.2) * 0.6; b.halo.scale.setScalar(0.6 + br * 1.0);
      b.light.intensity = br * 1.2;
      b.lb.set(`${k} ${p[k]} Ω ・ ${fmt(c[ik], 2)} A ・ ${fmt(c[vk], 2)} V`);
    });
    s.lBat.set(`${fmt(p.V, 1)} V ・ ${fmt(c.I, 2)} A`);
  },
  live(s) {
    const p = s.p, c = s.def.calc(s);
    const o = { R: fmt(c.R, 2) + ' Ω', I: fmt(c.I, 2) + ' A', V1: fmt(c.V1, 2) + ' V', V2: fmt(c.V2, 2) + ' V', P1: fmt(c.V1 * c.I1, 2) + ' W', P2: fmt(c.V2 * c.I2, 2) + ' W', P: fmt(p.V * c.I, 2) + ' W' };
    const pts = [[0, 0], [12, 12 / c.R]];
    o.graph = plot({ x: [0, 12], y: [0, Math.max(1, 12 / c.R) * 1.05], xl: '電池の電圧 V [V]', yl: '全体の電流 I [A]', series: [{ pts, c: C.vel, end: false }], pt: [{ x: p.V, y: c.I, c: C.warm, r: 5 }] });
    return o;
  },
  html(s) {
    return `<div class="ctl">${ui.goal(s)}${ui.seg(s, 'mode', 'つなぎ方', [['series', '直列'], ['parallel', '並列']])}
      ${ui.sliders(s, ['V', 'R1', 'R2'])}
      ${ui.seg(s, 'flow', '粒の表すもの', [['current', '電流の向き'], ['electron', '電子の動き']])}
      ${ui.meter([['R', '合成抵抗'], ['I', '全体の電流'], ['V1', 'R₁ の電圧'], ['V2', 'R₂ の電圧'], ['P1', 'R₁ の消費電力'], ['P2', 'R₂ の消費電力'], ['P', '全体の電力']])}
      ${ui.graph('電圧と電流（傾き = 1/合成抵抗）')}</div>`;
  },
  onParam(s, k) { if (k === 'mode') s.mem[s.p.mode] = true; },
  goal: '同じ2つの豆電球を、<b>直列</b>と<b>並列</b>の両方でつないでみよう。どちらが明るい？',
  goalMsg: '並列の方が明るい。並列ではそれぞれに電池の電圧がそのままかかる。',
  check(s) { s.mem[s.p.mode] = true; return s.mem.series && s.mem.parallel; },

const METALS = [['Cs', 'セシウム', 1.9], ['Na', 'ナトリウム', 2.3], ['Zn', '亜鉛', 4.3]];
function wlColor(nm) {
  // 波長 [nm] → 見える色（紫外線は紫っぽく）
  let r = 0, g = 0, b = 0;
  if (nm < 380) { r = 0.5; g = 0.2; b = 1; }
  else if (nm < 440) { r = -(nm - 440) / 60; b = 1; }
  else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
  else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
  else { r = 1; }
  return new THREE.Color(r, g, b);
}

function parseNum(str) {
  let t = String(str).trim().replace(/[０-９．－＋]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\s/g, '').replace(/[−ー]/g, '-').replace(/,/g, '');

  const v = Number(t);
  return t === '' || !isFinite(v) ? null : v;
}

const BEST_KEY = 'physics-3d:quiz-best';
function quizStart(cat) {
  const pool = shuffle(QUIZ.filter(q => !cat || simOf(q[0]).cat === cat)).slice(0, 10);
  state.quiz = { cat, qs: pool.map(q => ({ sim: q[0], q: q[1], answer: q[2], choices: shuffle(q.slice(2, 6)), ex: q[6] })), i: 0, score: 0, picked: null };
  quizShow();
}
function quizShow() { const q = state.quiz.qs[state.quiz.i]; if (q && R) { const prev = state.s; if (prev && prev.def.leave) prev.def.leave(prev); state.id = q.sim; loadSim(q.sim); renderLegend(); } renderCard(); }
function quizCardHTML() {
  const qz = state.quiz, n = qz.qs.length;
  if (qz.i >= n) {
    let best = 0; try { best = +localStorage.getItem(BEST_KEY) || 0; if (qz.score > best) localStorage.setItem(BEST_KEY, String(qz.score)); } catch (e) { /* 無視 */ }
    return `<div class="card-head"><div><div class="eyebrow">クイズ</div><h2 class="name">結果 ${qz.score} / ${n}</h2></div></div><div class="body">
      ${qz.score >= n * 0.8 ? '<div class="stamp">合格</div>' : ''}
      <div class="verdict ${qz.score >= n * 0.8 ? 'ok' : ''}">${qz.score === n ? '全問正解！' : qz.score >= n * 0.8 ? 'よくできました！' : 'まちがえた問題の実験を、もう一度動かしてみよう。'}</div>
      <p class="note" style="margin-top:6px">これまでの最高 ${Math.max(best, qz.score)} 問</p>
      <div class="row" style="margin-top:10px"><button type="button" class="btn main" data-quiz="${qz.cat || ''}">もう一度</button><button type="button" class="btn" data-quiz-menu="1">ほかの分野</button></div></div>`;
  }
  const q = qz.qs[qz.i], sm = simOf(q.sim);
  let h = `<div class="card-head"><div><div class="eyebrow">クイズ ${qz.i + 1} / ${n} ・ 正解 ${qz.score} ・ ${esc(sm.cat)}</div><div class="qprog"><i style="width:${qz.i / n * 100}%"></i></div></div></div><div class="body">
    <p class="qtext">${esc(q.q)}</p><div class="qchoices">${q.choices.map((c, k) => {
    let cls = '';
    if (qz.picked !== null) cls = c === q.answer ? 'right' : c === qz.picked ? 'wrong' : 'dim';
    return `<button type="button" class="qc ${cls}" data-pick="${k}" ${qz.picked !== null ? 'disabled' : ''}>${esc(c)}</button>`;
  }).join('')}</div>`;
  if (qz.picked !== null) h += `<div class="verdict ${qz.picked === q.answer ? 'ok' : 'ng'}" style="margin-top:8px">${qz.picked === q.answer ? '正解！' : `正解は「${esc(q.answer)}」`}</div><p class="txt" style="margin-top:6px">${esc(q.ex)}</p>
      <div class="row"><button type="button" class="btn main" data-a="qnext">${qz.i === n - 1 ? '結果を見る' : '次の問題'}</button><button type="button" class="btn" data-sim="${sm.id}">実験で確かめる</button></div>`;
  else h += `<p class="note" style="margin-top:8px">うしろの3D は「${esc(sm.name)}」。動かして考えてもよい。</p>`;
  return h + '</div>';
}
function quizMenuHTML() {
  return `<div class="card-head"><div><div class="eyebrow">クイズ</div><h2 class="name">どの分野にする？</h2><p class="lead">1回 10 問。答えると解説が出る。</p></div></div><div class="body"><div class="ctl">
    <button type="button" class="btn main" data-quiz="">ぜんぶから（10問）</button>
    ${CATS.map(([c]) => { const n = QUIZ.filter(q => simOf(q[0]).cat === c).length; return `<button type="button" class="btn" data-quiz="${c}">${c}（${Math.min(10, n)}問）</button>`; }).join('')}</div></div>`;
}

// ======================= 画面の組み立て =======================
function renderLib() {
  const lib = $('lib');
  const item = (attr, id, ic, name, extra, cur) => `<button type="button" class="item" ${attr}="${id}" aria-current="${!!cur}"><span class="ic">${ic}</span><span>${esc(name)}</span>${extra || ''}</button>`;
  const catOfSim = id => (simOf(id) || SIMS[0]).cat;
  if (state.mode === 'sim') {
    const cur = state.libCat || catOfSim(state.id);
    lib.innerHTML = `<div class="cats">${CATS.map(([c]) => { const l = SIMS.filter(x => x.cat === c); return `<button type="button" class="cat" data-cat="${c}" aria-pressed="${c === cur}">${c}<small>${l.filter(x => done.has(x.id)).length}/${l.length}</small></button>`; }).join('')}</div>`
      + `<div class="items">${SIMS.filter(x => x.cat === cur).map(x => item('data-sim', x.id, x.icon, x.name, done.has(x.id) ? '<span class="done">✓</span>' : '', x.id === state.id)).join('')}</div>`
      + `<p class="libfoot">「やってみよう」クリア ${SIMS.filter(x => done.has(x.id)).length} / ${SIMS.length}<br>ドラッグで回転、ホイール・ピンチで拡大。</p>`;
  } else if (state.mode === 'drill') {
    const curId = state.drill && state.drill.id;
    const cur = state.libCat || (curId ? catOfSim(DRILLS.find(d => d.id === curId).sim) : '力学');
    lib.innerHTML = `<div class="cats">${CATS.map(([c]) => { const l = DRILLS.filter(d => catOfSim(d.sim) === c); return `<button type="button" class="cat" data-cat="${c}" aria-pressed="${c === cur}">${c}<small>${l.filter(x => done.has(x.id)).length}/${l.length}</small></button>`; }).join('')}</div>`
      + `<div class="items">${DRILLS.filter(d => catOfSim(d.sim) === cur).map(d => item('data-drill', d.id, '計', d.name, done.has(d.id) ? '<span class="done">✓</span>' : '', d.id === curId)).join('')}</div>`
      + `<p class="libfoot">正解した問題 ${DRILLS.filter(d => done.has(d.id)).length} / ${DRILLS.length}</p>`;
  } else {
    lib.innerHTML = '<div class="items">' + [['', 'ぜんぶから']].concat(CATS.map(([c]) => [c, c])).map(([k, n]) => item('data-quiz', k, 'Q', n, '', state.quiz && (state.quiz.cat || '') === k)).join('') + '</div>';
  }
}
function simCardHTML() {
  const s = state.s, d = s.def, tab = state.tab;
  let h = `<div class="card-head"><div><div class="eyebrow">${esc(d.cat)}${done.has(d.id) ? ' ・ ✓ クリア' : ''}</div><h2 class="name">${esc(d.name)}</h2><p class="lead">${esc(d.lead)}</p></div></div>
    <div class="tabs" role="tablist">${[['try', 'やってみる'], ['how', 'しくみ・公式'], ['pts', 'ポイント']].map(([k, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${n}</button>`).join('')}</div><div class="body">`;
  if (tab === 'try') h += d.html(s);
  else if (tab === 'how') h += d.how;
  else {
    h += `<ul class="pts">${d.points.map(([k, t]) => `<li><b class="${k === 'x' ? 'x' : ''}">${k === 'x' ? '×' : '○'}</b><span>${esc(t)}</span></li>`).join('')}</ul>
      <div class="ls-exam"><h3>テスト・入試に出るポイント</h3>${esc(d.exam)}</div>`;
    const ds = DRILLS.filter(x => x.sim === d.id);
    if (ds.length) h += `<h3 class="sub">この単元の計算問題</h3><div class="row">${ds.map(x => `<button type="button" class="btn" data-drill="${x.id}">${esc(x.name)} →</button>`).join('')}</div>`;
  }
  return h + '</div>';
}
function renderCard() {
  const card = $('card');
  let h;
  if (state.mode === 'sim') h = state.s ? simCardHTML() : '';
  else if (state.mode === 'drill') h = drillCardHTML();
  else h = state.quiz ? quizCardHTML() : quizMenuHTML();
  const body = card.querySelector('.body'), y = body ? body.scrollTop : 0;
  card.innerHTML = h;
  const nb = card.querySelector('.body'); if (nb) nb.scrollTop = y;
  renderLive(true);
}
function setModeUI(mode) { state.mode = mode; document.querySelectorAll('#modes [data-mode]').forEach(b => b.setAttribute('aria-current', String(b.dataset.mode === mode))); renderLegend(); }
function go(id) {
  setModeUI('sim');
  const prev = state.s;
  if (prev && prev.def.id !== id && prev.def.leave) prev.def.leave(prev);
  state.id = id; state.tab = 'try'; state.libCat = null; state.quiz = null;
  renderLib();
  if (R) loadSim(id);
  renderCard();
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* 無視 */ }
}
function goDrill(id) {
  setModeUI('drill'); state.libCat = null;
  const d = DRILLS.find(x => x.id === id);
  if (R && (!state.s || state.s.def.id !== d.sim)) { const prev = state.s; if (prev && prev.def.leave) prev.def.leave(prev); state.id = d.sim; loadSim(d.sim); }
  drillStart(id); renderLib(); renderCard(); renderLegend();
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* 無視 */ }
}
function setMode(mode) {
  if (mode === 'sim') go(state.id || 'fall');
  else if (mode === 'drill') goDrill((state.drill && state.drill.id) || (DRILLS.find(d => d.sim === state.id) || DRILLS[0]).id);
  else { setModeUI('quiz'); state.quiz = null; state.libCat = null; renderLib(); renderCard(); }
}

// ======================= イベント =======================
const parseV = v => (v === 'true' ? true : v === 'false' ? false : v !== '' && !isNaN(+v) ? +v : v);
document.addEventListener('click', ev => {
  const t = ev.target, s = state.s;
  const m = t.closest('#modes [data-mode]');
  if (m) { setMode(m.dataset.mode); return; }
  const sm = t.closest('[data-sim]');
  if (sm) { go(sm.dataset.sim); return; }
  const dr = t.closest('[data-drill]');
  if (dr) { goDrill(dr.dataset.drill); return; }
  const qz = t.closest('[data-quiz]');
  if (qz) { setModeUI('quiz'); quizStart(qz.dataset.quiz || null); renderLib(); return; }
  if (t.closest('[data-quiz-menu]')) { state.quiz = null; renderLib(); renderCard(); return; }
  const cat = t.closest('[data-cat]');
  if (cat) { state.libCat = cat.dataset.cat; renderLib(); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderCard(); const b = $('card').querySelector('.body'); if (b) b.scrollTop = 0; return; }
  const pk = t.closest('[data-pick]');
  if (pk && state.quiz) { const q = state.quiz.qs[state.quiz.i]; state.quiz.picked = q.choices[+pk.dataset.pick]; if (state.quiz.picked === q.answer) state.quiz.score++; renderCard(); return; }
  const a = t.closest('[data-a]');
  if (a) {
    const k = a.dataset.a;
    if (k === 'qnext') { state.quiz.i++; state.quiz.picked = null; if (state.quiz.i >= state.quiz.qs.length) renderCard(); else quizShow(); return; }
    if (k === 'judge') { drillJudge(); return; }
    if (k === 'dskip') { const D = state.drill; D.result = 'skip'; D.n++; renderCard(); return; }
    if (k === 'dnext') { drillStart(state.drill.id); renderCard(); const el = $('dAns'); if (el) el.focus(); return; }
  }
  if (!s) return;
  const sg = t.closest('[data-seg]');
  if (sg) {
    const k = sg.dataset.seg, v = parseV(sg.dataset.v);
    s.p[k] = v;
    if ((s.def.rs || []).includes(k)) restart();
    else { if (s.def.onParam) s.def.onParam(s, k); renderCard(); }
    return;
  }
  const tg = t.closest('[data-tog]');
  if (tg) { const k = tg.dataset.tog; s.p[k] = !s.p[k]; if ((s.def.rs || []).includes(k)) { restart(); return; } if (s.def.onParam) s.def.onParam(s, k); renderCard(); return; }
  const ab = t.closest('#card [data-act], #card [data-preset], #card [data-vset]');
  if (ab && s.def.act) { s.def.act(s, ab.dataset.act || '', ab); if (state.s === s) renderCard(); return; }
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset && el.dataset.k, s = state.s;
  if (!k || !s) return;
  const q = ui.q(s, k); if (!q) return;
  s.p[k] = +el.value;
  const out = $('card').querySelector(`[data-o="${k}"]`); if (out) out.textContent = ui.val(q, s.p[k]);
  if (q.reset) { const tab = state.tab; loadSim(state.id, true); state.tab = tab; renderLive(true); }
  else if (s.def.onParam) s.def.onParam(s, k);
});
document.addEventListener('change', ev => { const el = ev.target; if (el.dataset && el.dataset.k && state.s) { const id = el.id; renderCard(); const n = $(id); if (n) n.focus(); } });
document.addEventListener('keydown', ev => {
  if (ev.target.id === 'dAns' && ev.key === 'Enter') { drillJudge(); return; }
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' && ev.target.type !== 'range' || tag === 'textarea' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === ' ' && tag !== 'button') { ev.preventDefault(); togglePlay(); }
  else if (ev.key === 'r' || ev.key === 'R') { restart(); state.running = true; updatePlay(); }
});
$('btnPlay').addEventListener('click', togglePlay);
$('btnRestart').addEventListener('click', () => { restart(); state.running = true; updatePlay(); });
$('btnStep').addEventListener('click', () => { const s = state.s; if (!s || s.ended) return; state.running = false; updatePlay(); advance(s, 0.05 * (s.def.timeScale || 1)); renderLive(true); });
$('speed').addEventListener('click', ev => { const b = ev.target.closest('[data-sp]'); if (!b) return; state.speed = +b.dataset.sp; document.querySelectorAll('#speed [data-sp]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
$('btnReset').addEventListener('click', () => { if (R && R.lastView) view(...R.lastView); });
$('btnFull').addEventListener('click', () => {
  const w = $('stageWrap');
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  if (w.requestFullscreen) w.requestFullscreen().catch(() => w.classList.toggle('is-max')); else w.classList.toggle('is-max');
});

// ======================= はじめる =======================
(function start() {
  const ok = initThree();
  if (!ok) { $('stage').innerHTML = '<div class="fallback">3D表示の部品（three.js）を読み込めませんでした。<br>インターネットにつながっているか確かめて、開き直してください。</div>'; $('playbar').hidden = true; }
  let h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* 無視 */ }
  if (!ok) { state.id = 'fall'; state.s = null; renderLib(); $('card').innerHTML = `<div class="card-head"><div><h2 class="name">物理ラボ3D</h2><p class="lead">3D を表示できる環境で開いてください。計算とクイズは使えます。</p></div></div>`; return; }
  if (DRILLS.some(d => d.id === h)) goDrill(h);
  else go(SIMS.some(x => x.id === h) ? h : 'fall');
})();
</script>
</body>
</html>
