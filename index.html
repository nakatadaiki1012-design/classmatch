<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>クラスマッチ トーナメント</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background:#f1f5f9; }
    .landing { max-width:560px; margin:0 auto; padding:48px 20px; text-align:center; }
    .landing h1 { font-size:28px; color:var(--navy); margin-bottom:8px; }
    .landing .sub { color:var(--muted); margin-bottom:32px; font-size:14px; }
    .entryGrid { display:grid; gap:16px; }
    .entryCard {
      display:block; text-decoration:none; text-align:left;
      background:#fff; border:1px solid var(--border); border-radius:14px;
      padding:22px 24px; transition:box-shadow .15s, border-color .15s, transform .1s;
    }
    .entryCard:hover { box-shadow:0 6px 18px rgba(0,0,0,.1); border-color:var(--primary); transform:translateY(-2px); }
    .entryCard .ico { font-size:30px; }
    .entryCard .t { font-size:18px; font-weight:800; color:var(--navy); margin:6px 0 4px; }
    .entryCard .d { font-size:13px; color:var(--muted); line-height:1.6; }
    .foot { margin-top:28px; font-size:12px; color:var(--subtle); }
  </style>
</head>
<body>
  <div class="landing">
    <h1>🏆 クラスマッチ トーナメント</h1>
    <div class="sub">学校の球技大会などのトーナメント運営・ライブ共有アプリ</div>
    <div class="entryGrid">
      <a class="entryCard" href="admin.html">
        <div class="ico">⚙️</div>
        <div class="t">管理画面を開く</div>
        <div class="d">先生・実行委員用。大会の作成、ブラケット生成、結果入力を行います（PC・タブレット推奨）。</div>
      </a>
      <a class="entryCard" href="viewer.html">
        <div class="ico">📱</div>
        <div class="t">生徒用ライブ画面を開く</div>
        <div class="d">対戦結果をリアルタイムで確認できる閲覧専用ページ。生徒はこちらを開いてください。</div>
      </a>
    </div>
    <div class="foot">管理画面で「共有」から生成したリンクを生徒に配布すると、常に最新のブラケットが見られます。</div>
  </div>
</body>
</html>
